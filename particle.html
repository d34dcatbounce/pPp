<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ASCII Swarm | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            cursor: none; /* 시스템 커서 숨김 */
        }

        #scatter-canvas {
            display: block;
        }

        /* 🎯 아스키 조준경 */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            z-index: 9999;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8);
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 32px; left: 32px;
            color: #4b5563;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="select-none">

    <div id="custom-cursor">[ + ]</div>

    <div id="ui-layer">
        <div class="text-xs tracking-[0.2em] mb-1">[ 019 : ASCII_SWARM ]</div>
        <div class="text-[10px] tracking-widest opacity-50 uppercase">BEHAVIORAL_LOGIC: SWARM_INTELLIGENCE</div>
        <div id="status-text" class="text-cyan-500 text-xs mt-6 font-bold tracking-tighter">DATA_FRAGMENTS: COHESIVE</div>
    </div>

    <canvas id="scatter-canvas"></canvas>

    <div class="absolute bottom-8 w-full text-center text-[10px] text-gray-700 tracking-[0.3em] uppercase pointer-events-none">
        Move cursor to attract data fragments. Click to disperse.
    </div>

    <script>
        const canvas = document.getElementById('scatter-canvas');
        const ctx = canvas.getContext('2d');
        const customCursor = document.getElementById('custom-cursor');
        const statusText = document.getElementById('status-text');

        let width, height;
        let particles = [];
        const particleCount = 250; // 아스키 텍스트 조각 개수

        // 파편으로 쓰일 아스키 문자들
        const chars = ['0', '1', '#', '@', '%', '*', 'x', '+', '-', ':', '.'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 🎯 텍스트 파티클 클래스
        class AsciiParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                
                // 크기 대신 폰트 사이즈 부여
                this.fontSize = Math.floor(Math.random() * 10) + 8; // 8px ~ 18px
                this.char = chars[Math.floor(Math.random() * chars.length)];
                
                this.friction = 0.92; // 마찰력 (숫자가 작을수록 뻑뻑하게 멈춤)
                this.isScattering = false;
            }

            update(mouse) {
                // 마우스와의 거리 계산
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (this.isScattering) {
                    // 폭발 후 감속 로직
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                    if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
                        this.isScattering = false;
                    }
                } else {
                    // 마우스 커서를 향해 날아오는 로직 (거리가 300px 이내일 때)
                    if (dist < 300 && dist > 10) {
                        // 커서에 가까울수록 더 강하게 끌어당김
                        const force = (300 - dist) / 300; 
                        this.vx += (dx / dist) * force * 0.8;
                        this.vy += (dy / dist) * force * 0.8;
                    } else if (dist <= 10) {
                        // 커서 중심부에 도달하면 주변을 맴돎
                        this.vx += (Math.random() - 0.5) * 2;
                        this.vy += (Math.random() - 0.5) * 2;
                    } else {
                        // 커서와 멀어지면 랜덤하게 떠다님 (무중력 표류)
                        this.vx += (Math.random() - 0.5) * 0.1;
                        this.vy += (Math.random() - 0.5) * 0.1;
                    }
                }

                // 마찰력 적용 및 위치 업데이트
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;

                // 화면 밖으로 나가지 못하게 벽에 튕기기 (Bounce)
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                // 속도가 빠를수록 색상이 청록색(Cyan)에 가까워지고, 느리면 어두운 회색이 됨
                const speed = Math.hypot(this.vx, this.vy);
                const isFast = speed > 3;

                ctx.fillStyle = isFast ? '#06b6d4' : '#6b7280';
                ctx.font = `bold ${this.fontSize}px 'Courier New', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 빠른 텍스트에는 약간의 글로우 효과
                if (isFast) {
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = '#06b6d4';
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(this.char, this.x, this.y);
            }

            // 클릭 시 사방으로 폭발
            scatter(mouse) {
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.max(Math.hypot(dx, dy), 1); // 0으로 나누기 방지
                
                // 커서와 가까운 조각일수록 더 강하게 튕겨나감
                const force = Math.max(300 - dist, 0) / 10;
                
                this.vx = (dx / dist) * force;
                this.vy = (dy / dist) * force;
                this.isScattering = true;
            }
        }

        // 초기 생성
        for (let i = 0; i < particleCount; i++) {
            particles.push(new AsciiParticle());
        }

        let mouse = { x: -1000, y: -1000 };

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            customCursor.style.left = `${mouse.x}px`;
            customCursor.style.top = `${mouse.y}px`;
        });

        // 클릭 시 흩어짐 (폭발)
        document.addEventListener('mousedown', () => {
            statusText.innerText = 'DATA_FRAGMENTS: DISPERSED';
            statusText.style.color = '#ef4444'; // 붉은색 에러 느낌
            
            // 시각적 폭발 효과 (가상의 흰색 원)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
            ctx.fill();

            particles.forEach(p => p.scatter(mouse));
        });

        document.addEventListener('mouseup', () => {
            setTimeout(() => {
                statusText.innerText = 'DATA_FRAGMENTS: COHESIVE';
                statusText.style.color = '#06b6d4'; // 다시 청록색 복구
            }, 1000); // 1초 뒤에 다시 모여들기 시작하는 타이밍에 맞춤
        });

        function animate() {
            // 잔상(Trail)을 남기기 위해 캔버스를 반투명한 검은색으로 덮음
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update(mouse);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
