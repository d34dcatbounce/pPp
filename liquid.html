<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Concrete Rose | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 세로 스크롤 완전 차단 */
            background-color: #050505; /* 완전한 어둠 */
            /* 🎯 핵심: 모든 것을 고정폭 아스키 폰트로 통일 */
            font-family: 'Courier New', Courier, monospace;
        }

        /* 가로 스크롤 트랙 */
        #horizontal-track {
            display: flex;
            align-items: flex-end; /* 건물(텍스트)들이 바닥에 붙도록 정렬 */
            height: 100vh;
            width: fit-content;
            padding-left: 10vw;
            padding-right: 50vw;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* 🎯 아스키 빌딩 컨테이너 */
        .building {
            flex-shrink: 0;
            margin-right: 16px; /* 건물 사이 간격 */
            color: #262626; /* 어두운 콘크리트 색상 */
            font-size: 14px;
            line-height: 14px;
            letter-spacing: 2px;
            white-space: pre; /* 띄어쓰기 및 줄바꿈 유지 */
            user-select: none;
        }

        /* 🎯 아스키 장미 (단 하나의 강렬한 기호) */
        #the-rose {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: #f43f5e; /* 로즈 핑크 */
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            z-index: 50;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.8), 0 0 5px rgba(244, 63, 94, 1);
            transition: transform 0.3s ease, text-shadow 0.3s ease;
            animation: pulse-rose 2s infinite alternate;
        }

        #the-rose:hover {
            transform: translateX(-50%) scale(1.5);
            text-shadow: 0 0 25px rgba(244, 63, 94, 1);
        }

        @keyframes pulse-rose {
            0% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(244, 63, 94, 1); }
        }

        /* UI 레이어 */
        #ui-layer {
            position: fixed;
            top: 32px; left: 32px;
            color: #4b5563;
            z-index: 100;
            pointer-events: none;
            text-transform: uppercase;
        }

        #scroll-guide {
            position: fixed;
            bottom: 32px; right: 32px;
            color: #374151;
            font-size: 10px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="text-xs tracking-[0.2em] mb-1">[ 025 : CONCRETE_ROSE ]</div>
        <div class="text-[10px] tracking-widest opacity-50">LOCATION: ASCII_URBAN_DESERT</div>
        <div class="mt-8 text-gray-400 text-sm tracking-tighter opacity-80">"TXT_OVERRIDE: FIND_THE_ROSE"</div>
    </div>

    <div id="scroll-guide">WHEEL_TO_NAVIGATE //</div>

    <div id="horizontal-track">
        </div>

    <script>
        const track = document.getElementById('horizontal-track');
        const buildingCount = 120; // 120개의 아스키 빌딩
        const rosePosition = Math.floor(Math.random() * 80) + 20; // 20~100번째 건물 사이

        // 건물 생성용 아스키 블록 문자들 (가득 찬 블록, 노이즈 창문 블록)
        const blocks = ['█', '█', '█', '█', '▓', '▒'];

        for (let i = 0; i < buildingCount; i++) {
            const b = document.createElement('div');
            b.className = 'building';
            
            // 건물의 가로(열)와 세로(행) 크기를 랜덤 지정
            const cols = Math.floor(Math.random() * 8) + 4;  // 4칸 ~ 11칸 폭
            const rows = Math.floor(Math.random() * 40) + 10; // 10줄 ~ 49줄 높이

            let buildingAscii = "";
            
            // 텍스트로 블록 쌓기
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    buildingAscii += blocks[Math.floor(Math.random() * blocks.length)];
                }
                buildingAscii += "\n";
            }
            
            b.innerText = buildingAscii;

            // 🎯 장미 배치
            if (i === rosePosition) {
                b.style.position = 'relative';
                const rose = document.createElement('div');
                rose.id = 'the-rose';
                rose.innerText = '@'; // 장미를 상징하는 아스키 기호
                
                rose.onclick = () => {
                    alert("[ SYSTEM_LOG ] : 탈출 코드를 해독했습니다. (ROSE_FOUND)");
                    // 원래 메인 아카이브로 돌아가는 로직
                    window.location.href = 'index.html'; 
                };
                
                b.appendChild(rose);
                // 장미가 숨쉴 수 있게 틈(여백)을 조금 더 줌
                b.style.marginRight = '40px';
                b.style.marginLeft = '20px';
            }

            track.appendChild(b);
        }

        // 휠-가로 스크롤 매핑
        let scrollPos = 0;

        window.addEventListener('wheel', (e) => {
            scrollPos += e.deltaY * 1.5; // 스크롤 감도 조절
            
            // 왼쪽 끝 제한
            if (scrollPos < 0) scrollPos = 0;
            
            // 오른쪽 끝 제한 계산
            const maxScroll = track.scrollWidth - window.innerWidth;
            if (scrollPos > maxScroll) scrollPos = maxScroll;

            // 트랙 횡스크롤
            track.style.transform = `translateX(-${scrollPos}px)`;
        });
    </script>
</body>
</html>
