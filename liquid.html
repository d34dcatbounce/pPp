<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Liquid Typo | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            cursor: none; /* 시스템 커서 숨김 */
        }

        /* 텍스트 그리드를 렌더링할 캔버스 */
        #liquid-canvas {
            display: block;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 32px; left: 32px;
            color: #4b5563;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="h-screen w-screen relative select-none">

    <div id="ui-layer" class="select-none">
        <div class="text-xs tracking-[0.2em] mb-1">[ 016 : LIQUID_TYPO ]</div>
        <div class="text-[10px] tracking-widest text-gray-600 uppercase">FLOW_STATE: ACTIVE</div>
        <div class="mt-8 text-cyan-500 text-sm tracking-widest font-bold" id="flow-display">CURSOR_DATA_STREAM: [ON]</div>
    </div>

    <canvas id="liquid-canvas"></canvas>

    <div class="absolute bottom-8 w-full text-center text-gray-600 font-mono text-[10px] tracking-widest z-40 pointer-events-none uppercase">
        Click anywhere to accelerate the data stream.
    </div>

    <script>
        const canvas = document.getElementById('liquid-canvas');
        const ctx = canvas.getContext('2d');
        const flowDisplay = document.getElementById('flow-display');

        let width, height;
        let charW, charH;
        let cols, rows;
        
        let grid = []; // 텍스트 그리드 (2차원 배열)
        let particleCount = 0; // 화면에 쌓인 파티클 수

        // 🎯 사용할 아스키 문자셋
        const charSet = ['A', 'X', '?', '!', '0', '1', '@', '#', '%', '*', '+', '-', '$', '/', '\\'];

        // 1. 초기 세팅 및 그리드 생성
        function init() {
            // 글자 크기 측정
            const span = document.createElement('span');
            span.style.fontFamily = "'Courier New', Courier, monospace";
            span.style.fontSize = '14px';
            span.style.letterSpacing = '2px';
            span.innerText = 'X';
            document.body.appendChild(span);
            charW = span.getBoundingClientRect().width;
            charH = 14; 
            document.body.removeChild(span);

            resize();
            requestAnimationFrame(animate);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cols = Math.floor(width / charW);
            rows = Math.floor(height / charH) + 1;
            
            // 기존 그리드 데이터를 유지하며 리사이즈 (간단하게 초기화)
            grid = [];
            for (let r = 0; r < rows; r++) {
                grid.push(new Array(cols).fill(null));
            }
        }

        window.addEventListener('resize', resize);

        // 2. 🎯 [핵심] 리퀴드 파티클 로직 (데이터 스트림 생성)
        function spawnParticle() {
            const char = charSet[Math.floor(Math.random() * charSet.length)];
            const spawnX = Math.floor(cols / 2); // 화면 중앙 상단에서 생성
            
            // 아직 바닥에 닿지 않은 파티클 (x, y 좌표, character, velocity_y)
            return { x: spawnX, y: 0, char: char, vy: 1 };
        }

        let particles = []; // 활성 파티클 배열

        // 3. 메인 루프 (애니메이션)
        function animate() {
            // 캔버스 초기화
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);
            
            // 새 파티클 생성 (매 프레임마다 하나씩)
            particles.push(spawnParticle());

            // 🎯 [핵심] 파티클 업데이트 및 충돌 검사
            ctx.fillStyle = '#d1d5db'; // 기본 파티클 색상 (무채색)
            ctx.font = '14px "Courier New", Courier, monospace';
            ctx.letterSpacing = '2px';

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.y += p.vy; // 아래로 이동

                // 화면 바닥에 닿았을 때
                if (p.y >= rows - 1) {
                    p.y = rows - 1;
                    grid[p.y][p.x] = { char: p.char, color: '#d1d5db' };
                    particles.splice(i, 1);
                    continue;
                }

                // 아래 칸이 이미 꽉 찼을 때
                if (grid[p.y + 1][p.x]) {
                    // 왼쪽이나 오른쪽으로 미끄러질 수 있는지 확인 (리퀴드 효과)
                    const leftFree = p.x > 0 && !grid[p.y + 1][p.x - 1];
                    const rightFree = p.x < cols - 1 && !grid[p.y + 1][p.x + 1];

                    if (leftFree && rightFree) {
                        if (Math.random() < 0.5) {
                            p.x--;
                        } else {
                            p.x++;
                        }
                        // 수직 속도를 약간 증가시켜 미끄러지는 느낌을 줌
                        p.vy = 1; 
                    } else if (leftFree) {
                        p.x--;
                        p.vy = 1;
                    } else if (rightFree) {
                        p.x++;
                        p.vy = 1;
                    } else {
                        // 미끄러질 곳이 없으면 그 자리에서 정지
                        grid[p.y][p.x] = { char: p.char, color: '#d1d5db' };
                        particles.splice(i, 1);
                        continue;
                    }
                }

                // 활성 파티클 그리기
                ctx.fillText(p.char, p.x * charW, p.y * charH);
            }

            // 🎯 [핵심] 화면 바닥에 pooling 된 아스키 텍스트 그리기
            particleCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const settled = grid[r][c];
                    if (settled) {
                        //Pooling 된 아스키아트에 청록색 글로우 효과
                        ctx.fillStyle = settled.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = settled.color === '#d1d5db' ? 'rgba(209, 213, 219, 0.2)' : 'rgba(6, 182, 212, 0.4)';
                        ctx.fillText(settled.char, c * charW, r * charH);
                        // 글로우 초기화
                        ctx.shadowBlur = 0;
                        particleCount++;
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        // 클릭 시 데이터 스트림 가속화
        canvas.addEventListener('click', () => {
            for (let i = 0; i < 50; i++) {
                particles.push(spawnParticle());
            }
            flowDisplay.innerText = `CURSOR_DATA_STREAM: [FAST]`;
            setTimeout(() => {
                flowDisplay.innerText = `CURSOR_DATA_STREAM: [ON]`;
            }, 500);
        });

        init();
    </script>
</body>
</html>
