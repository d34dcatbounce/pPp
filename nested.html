<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nested System | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #d1d5db;
        }

        /* 1. 물리적 노트북의 베젤 (전체 화면) */
        #phys-bezel {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            border: 40px solid #1f2937; /* 짙은 회색 프레임 */
            border-bottom-width: 60px; /* 하단은 조금 더 두껍게 */
            background-color: #111827; /* 스크린 어둠 */
            border-radius: 12px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 2. [핵심] 노트북 속 노트북 화면 (가상 스크린) */
        #nested-screen {
            flex: 1;
            background-color: #111827; /* 짙은 네이비/블랙 터미널 */
            margin: 20px;
            border: 4px solid #111827;
            border-radius: 4px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            padding: 20px;
            font-family: 'Courier New', Courier, monospace; /* 터미널 폰트 */
            position: relative;
            overflow: hidden;
        }

        /* 터미널 텍스트 스타일 */
        #terminal-display {
            font-size: 16px;
            line-height: 1.6;
            color: #06b6d4; /* 청록색 텍스트 */
            text-shadow: 0 0 10px rgba(6,182,212,0.4);
            letter-spacing: 0.1em;
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* 깜빡이는 커서 효과 */
        #cursor {
            display: inline-block;
            width: 8px; height: 18px;
            background-color: #06b6d4;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 3. 물리적 키보드 영역 (하단) */
        #phys-keyboard-area {
            height: 250px;
            border-top: 2px solid #374151;
            background-color: #1f2937;
            padding: 15px;
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.3);
            perspective: 800px; /* 3D 효과를 위한 원근감 */
        }

        /* 개별 키 스타일 */
        .key {
            background-color: #111827;
            border: 1px solid #374151;
            color: #d1d5db;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s ease;
            transform-style: preserve-3d;
            box-shadow: 0 3px 0 #000;
        }

        /* 키 호버 효과 (살짝 밝아짐) */
        .key:hover {
            background-color: #374151;
        }

        /* 키 클릭 효과 (실제로 눌리는 듯한 느낌) */
        .key:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 1px 0 #000;
        }

        /* 특수 키 스타일 */
        .special-key {
            background-color: #1f2937;
            color: #d1d5db;
        }

        /* 키보드 레이아웃 그리드 구성 */
        .row {
            display: grid;
            gap: 6px;
        }
        .row-1 { grid-template-columns: repeat(13, 1fr) 2fr; } /* Backspace */
        .row-2 { grid-template-columns: 1.5fr repeat(13, 1fr); } /* Tab */
        .row-3 { grid-template-columns: 2fr repeat(11, 1fr) 2fr; } /* CapsLk, Enter */
        .row-4 { grid-template-columns: 2.5fr repeat(10, 1fr) 2.5fr; } /* Shift, Shift */
        .row-5 { grid-template-columns: repeat(3, 1fr) 6fr repeat(3, 1fr); } /* Space, etc. */

    </style>
</head>
<body class="select-none h-screen w-screen relative">

    <div id="phys-bezel">

        <div id="nested-screen">
            <div id="terminal-display">DFA_SYSTEM_ARCHIVE [NESTED_INTERFACE]<br>> <span id="typed-text"></span><span id="cursor"></span></div>
        </div>

        <div id="phys-keyboard-area">
            
            <div class="row row-1">
                <div class="key" data-key="1">1</div> <div class="key" data-key="2">2</div> <div class="key" data-key="3">3</div> <div class="key" data-key="4">4</div>
                <div class="key" data-key="5">5</div> <div class="key" data-key="6">6</div> <div class="key" data-key="7">7</div> <div class="key" data-key="8">8</div>
                <div class="key" data-key="9">9</div> <div class="key" data-key="0">0</div> <div class="key" data-key="-">-</div> <div class="key" data-key="=">=</div>
                <div class="key special-key" data-key="Backspace">BKSP</div>
            </div>

            <div class="row row-2">
                <div class="key special-key" data-key="Tab">TAB</div>
                <div class="key" data-key="q">Q</div> <div class="key" data-key="w">W</div> <div class="key" data-key="e">E</div> <div class="key" data-key="r">R</div>
                <div class="key" data-key="t">T</div> <div class="key" data-key="y">Y</div> <div class="key" data-key="u">U</div> <div class="key" data-key="i">I</div>
                <div class="key" data-key="o">O</div> <div class="key" data-key="p">P</div> <div class="key" data-key="[">[</div> <div class="key" data-key="]">]</div>
            </div>

            <div class="row row-3">
                <div class="key special-key" data-key="CapsLock">CAPS</div>
                <div class="key" data-key="a">A</div> <div class="key" data-key="s">S</div> <div class="key" data-key="d">D</div> <div class="key" data-key="f">F</div>
                <div class="key" data-key="g">G</div> <div class="key" data-key="h">H</div> <div class="key" data-key="j">J</div> <div class="key" data-key="k">K</div>
                <div class="key" data-key="l">L</div> <div class="key" data-key=";">;</div> <div class="key" data-key="'">'</div>
                <div class="key special-key" data-key="Enter">ENTER</div>
            </div>

            <div class="row row-4">
                <div class="key special-key" data-key="Shift">SHIFT</div>
                <div class="key" data-key="z">Z</div> <div class="key" data-key="x">X</div> <div class="key" data-key="c">C</div> <div class="key" data-key="v">V</div>
                <div class="key" data-key="b">B</div> <div class="key" data-key="n">N</div> <div class="key" data-key="m">M</div> <div class="key" data-key=",">,</div>
                <div class="key" data-key=".">.</div> <div class="key" data-key="/">/</div>
                <div class="key special-key" data-key="Shift">SHIFT</div>
            </div>

            <div class="row row-5">
                <div class="key special-key" data-key="Control">CTRL</div> <div class="key special-key" data-key="Alt">ALT</div> <div class="key special-key" data-key="Win">DFA</div>
                <div class="key" data-key=" ">SPACE</div>
                <div class="key special-key" data-key="ArrowLeft">◀</div> <div class="key special-key" data-key="ArrowDown">▼</div> <div class="key special-key" data-key="ArrowRight">▶</div>
            </div>

        </div>

    </div>

    <div class="absolute top-12 left-12 text-gray-500 font-mono text-xs tracking-widest z-20 pointer-events-none">
        [ 011 : NESTED_SYSTEM ]<br>
        INTERFACE_DEFORMATION_TEST
    </div>

    <script>
        const terminalDisplay = document.getElementById('terminal-display');
        const typedText = document.getElementById('typed-text');
        const keyboard = document.getElementById('phys-keyboard-area');
        let currentString = ""; // 현재 입력된 문자열을 저장

        // 🎯 [핵심] 가상 키보드 클릭 이벤트 (키보드 영역 전체에 하나의 이벤트 리스너)
        keyboard.addEventListener('click', (event) => {
            // 클릭된 요소가 .key인지 확인 (안쪽 span이나 div 등이 클릭되어도 부모의 data-key를 얻기 위해 closest() 사용)
            const keyEl = event.target.closest('.key');
            if (!keyEl) return; // 키가 아닌 영역 클릭 시 무시

            // 클릭된 키의 고유 data-key 값 가져오기
            const keyValue = keyEl.dataset.key;
            if (!keyValue) return;

            // 라벨링 (DFA 등)은 실제 입력에서 제외
            if (keyValue === "CapsLock" || keyValue === "Control" || keyValue === "Alt" || keyValue === "Win" || keyValue.startsWith("Arrow") || keyValue === "Tab") {
                return;
            }

            if (keyValue === "Backspace") {
                // 백스페이스: 문자열의 마지막 한 글자 제거
                currentString = currentString.slice(0, -1);
            } else if (keyValue === "Enter") {
                // 엔터: 줄바꿈 후 새로운 프롬프트(`> `) 추가
                currentString += "<br>> ";
            } else if (keyValue === "Shift") {
                // Shift: 일단은 대문자로 변환하는 효과만 (나중에 복잡하게 추가 가능)
                currentString = currentString.toUpperCase();
            } else {
                // 일반 키: 해당 문자를 문자열에 추가
                currentString += keyValue;
            }

            // 🎯 [수정됨] 최종 문자열을 HTML로 화면에 반영
            typedText.innerHTML = currentString;

            // 화면 하단으로 자동 스크롤
            const screen = document.getElementById('nested-screen');
            screen.scrollTop = screen.scrollHeight;
        });

    </script>
</body>
</html>
