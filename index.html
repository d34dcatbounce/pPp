<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFA Official Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        /* 픽셀의 부드러운 트랜지션 */
        .pixel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 호버 시 툴팁이 부드럽게 나타나는 애니메이션 */
        .pixel:hover .tooltip {
            opacity: 1;
            visibility: visible;
            transform: translate(15px, -50%);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative overflow-hidden text-gray-900">

    <header class="absolute top-8 left-8 select-none">
        <h1 class="text-xl font-bold tracking-[0.15em]">[OFFICIAL ARCHIVE]</h1>
        <p class="text-sm tracking-widest text-gray-400 mt-1">[DFA]</p>
    </header>

    <main class="relative z-10 perspective-1000">
        <div id="pixel-grid" class="grid grid-cols-8 w-[600px] h-[600px] bg-gray-100 shadow-2xl relative">
            </div>
    </main>

    <footer class="absolute bottom-8 text-center w-full select-none">
        <p class="text-xs tracking-[0.25em] text-gray-500 font-medium">
            EXPLORE THE DATA GRID. CLICK ANY PIXEL TO NAVIGATE.
        </p>
    </footer>

   <script>
        const gridContainer = document.getElementById('pixel-grid');
        const totalPixels = 64; // 8x8 그리드
        const hoverColor = '#06b6d4'; 

        // 🎯 [추가됨] 연결할 파일과 툴팁 이름을 관리하는 모듈 맵
        // 나중에 파일을 추가하면 여기에 번호와 파일명만 추가하면 끝!
        const moduleMap = {
            1: { file: 'circle.html', title: '077 : PERFECT_CIRCLE' },
            2: { file: 'cursor.html', title: '013 : CURSOR_LAB' },
            3: { file: 'liquid.html', title: '017 : LIQUID_LAB' },
            4: { file: 'peeking.html', title: '099 : THE_KEYHOLE' },
            5: { file: 'punching.html', title: '033 : PUNCHING_LAB' },
            6: { file: 'rain.html', title: '044 : ACID_RAIN' }
        };

        // 🎯 [수정됨] 페이지 이동을 처리하는 함수
        function navigateToPage(pixelIndex) {
            // 클릭한 번호가 moduleMap에 등록되어 있는지 확인
            if (moduleMap[pixelIndex]) {
                // 등록되어 있다면 해당 HTML 파일로 이동
                window.location.href = `./${moduleMap[pixelIndex].file}`;
            } else {
                // 아직 빈 칸이라면 알림창 띄우기
                alert(`[ SYSTEM NOTICE ]\n데이터 파편 #${String(pixelIndex).padStart(2, '0')}은(는) 아직 복구 중입니다.`);
            }
        }

        // 64개의 픽셀 생성 루프
        for (let i = 0; i < totalPixels; i++) {
            const pixelIndex = i + 1; // 1부터 64까지의 번호
            
            // 배경 회색조 랜덤 생성
            const grayIntensity = Math.floor(Math.random() * 35) + 210;
            const baseBgColor = `rgb(${grayIntensity}, ${grayIntensity}, ${grayIntensity})`;

            const pixel = document.createElement('div');
            pixel.className = 'pixel relative block w-full h-full cursor-pointer z-10 border-[0.5px] border-white/40';
            pixel.style.backgroundColor = baseBgColor;

            // 🎯 [수정됨] 툴팁 내용 설정 (할당된 파일이 있으면 해당 타이틀 사용, 없으면 기본 이름)
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip absolute left-full top-1/2 -translate-y-1/2 px-4 py-2 bg-gray-900 text-cyan-400 text-xs tracking-widest whitespace-nowrap opacity-0 invisible transition-all duration-300 pointer-events-none shadow-lg border border-cyan-900 z-50';
            
            const displayTitle = moduleMap[pixelIndex] ? moduleMap[pixelIndex].title : `PROJECT_FRAGMENT_${String(pixelIndex).padStart(2, '0')}`;
            tooltip.innerHTML = `${displayTitle} <br><span class="text-[9px] text-gray-400 mt-1 block">VIEW DETAIL</span>`;

            // 마우스 호버(올렸을 때) 이벤트
            pixel.addEventListener('mouseenter', function() {
                // 연결된 모듈이 있는 칸은 청록색, 없는 칸은 약간 어두운 회색으로 반응을 다르게 주면 더 좋습니다.
                this.style.backgroundColor = moduleMap[pixelIndex] ? hoverColor : '#9ca3af';
                this.style.transform = 'scale(1.08)';
                this.style.zIndex = '50';
                this.style.boxShadow = moduleMap[pixelIndex] ? '0 0 20px rgba(6, 182, 212, 0.4)' : 'none';
                this.style.borderColor = 'transparent';
            });

            // 마우스 리브(벗어났을 때) 이벤트
            pixel.addEventListener('mouseleave', function() {
                this.style.backgroundColor = baseBgColor;
                this.style.transform = 'scale(1)';
                this.style.zIndex = '10';
                this.style.boxShadow = 'none';
                this.style.borderColor = 'rgba(255, 255, 255, 0.4)';
            });

            // 클릭 시 호출 함수 실행
            pixel.addEventListener('click', function() {
                navigateToPage(pixelIndex);
            });

            // DOM에 추가
            pixel.appendChild(tooltip);
            gridContainer.appendChild(pixel);
        }
    </script>
</body>
</html>
