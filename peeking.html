<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Keyhole v2 | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            /* 3D 원근감을 주기 위한 세팅 */
            perspective: 1000px; 
        }

        /* 1. [수정] 구멍 너머의 배경 (시력검사 집 그림) */
        #secret-room {
            position: absolute;
            /* 배경이 움직일 여유 공간을 위해 화면보다 크게 설정 (120%) */
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            /* 엿보이는 대상 이미지 (시력검사 집 그림) */
            background-image: url('https://preview.redd.it/remember-this-during-your-eye-exam-v0-zu881crdbuy41.jpg?width=640&crop=smart&auto=webp&s=cc1a05864f32e2714cf33362cfd88fa242d9e8fe');
            background-size: cover;
            background-position: center;
            
            /* 마우스 움직임에 따라 아주 부드럽게 따라오도록 transition 부여 */
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. [수정] 전경 레이어 (완전 불투명 검은 화면 + 뚫린 구멍) */
        #vignette-hole {
            position: absolute;
            inset: 0;
            /* 🎯 완전 불투명 검은색 배경 */
            background-color: #000;
            /* 🎯 CSS mask로 중앙만 투명하게 뚫음 */
            -webkit-mask-image: radial-gradient(
                circle at 50% 50%, 
                transparent 120px, 
                black 150px
            );
            mask-image: radial-gradient(
                circle at 50% 50%, 
                transparent 120px, 
                black 150px
            );
            /* 마우스 이벤트가 이 검은 레이어를 뚫고 지나가도록 설정 */
            pointer-events: none; 
            z-index: 10;
        }

        /* 구멍 테두리에 미세한 두께감 표현 (v1 유지) */
        #hole-edge {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border-radius: 50%;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 1);
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body class="h-screen w-screen relative select-none">

    <div id="secret-room">
        </div>

    <div id="vignette-hole"></div>
    <div id="hole-edge"></div>

    <div class="absolute top-8 left-8 text-gray-700 font-mono text-xs tracking-widest z-20">
        [ 099 : THE_KEYHOLE ]<br>
        MATHEMATICAL_VERIFICATION: COMPLETE<br>
        STATUS: OBSERVING_SYSTEM
    </div>

    <script>
        const room = document.getElementById('secret-room');

        // 마우스가 움직일 때마다 실행되는 이벤트
        document.addEventListener('mousemove', (e) => {
            // 화면 중앙을 (0, 0) 기준으로 마우스 좌표 계산
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // 마우스가 중앙에서 얼마나 벗어났는지 비율 계산 (-1 ~ 1 사이 값)
            const mouseX = (e.clientX - centerX) / centerX;
            const mouseY = (e.clientY - centerY) / centerY;

            // 🎯 [핵심] 시차(Parallax) 착시 연산
            // 마우스가 왼쪽으로 가면 배경은 오른쪽으로 이동해야 '엿보기' 각도가 맞음
            const moveX = mouseX * -50; // 최대 50px 이동 (v1보다 약간 더 움직여 깊이감 강조)
            const moveY = mouseY * -50; 

            // 입체감을 더하기 위해 살짝 회전(tilt) 효과도 추가
            const rotateX = mouseY * 4; 
            const rotateY = mouseX * -4; 

            // CSS transform을 통해 배경을 미세하게 이동 및 회전
            room.style.transform = `
                translate(${moveX}px, ${moveY}px) 
                rotateX(${rotateX}deg) 
                rotateY(${rotateY}deg)
            `;
        });
    </script>
</body>
</html>
