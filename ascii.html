<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ASCII Cursor | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff; /* 흰 배경 */
            /* 🎯 기본 커서 투명화 (숨김) */
            cursor: none; 
        }

        /* 아스키아트가 가득 찰 컨테이너 */
        #ascii-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            color: #000000; /* 검은 글자 */
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 14px;
            letter-spacing: 2px;
            
            /* 줄바꿈을 허용하여 화면을 꽉 채우도록 설정 */
            word-break: break-all; 
            white-space: normal;
            pointer-events: none; /* 텍스트 선택 방지 */
            
            /* 🎯 [핵심] CSS 마스크: 자바스크립트가 전달한 --x, --y 좌표에만 40px 크기의 뚜렷한 원형 구멍을 뚫어 아스키아트를 보여줌 */
            -webkit-mask-image: radial-gradient(circle 45px at var(--x, -100px) var(--y, -100px), black 100%, transparent 100%);
            mask-image: radial-gradient(circle 45px at var(--x, -100px) var(--y, -100px), black 100%, transparent 100%);
        }

        /* 상단 UI 라벨 */
        #header-label {
            position: absolute;
            top: 12px; left: 12px;
            color: #9ca3af; /* 회색 텍스트 */
            font-size: 14px;
            letter-spacing: 0.15em;
            z-index: 20;
            pointer-events: none;
        }

        /* 하단 태그라인 */
        #tagline {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: #9ca3af;
            font-size: 14px;
            letter-spacing: 0.1em;
            z-index: 20;
            pointer-events: none;
        }

        /* 마우스를 따라다니는 청록색(Cyan) 정보 라벨 */
        #floating-label {
            position: fixed;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 30;
            color: #06b6d4; /* 청록색 */
            font-size: 10px;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body class="h-screen w-screen relative select-none">

    <div id="ascii-container"></div>

    <div id="header-label">
        [OFFICIAL ARCHIVE]<br>
        [DFA]
    </div>

    <div id="tagline" class="uppercase">
        ASCII DATA IS ONLY VISIBLE WITHIN THE CURSOR BOUNDARY.
    </div>

    <div id="floating-label">
        <span id="coord-x">X: ?</span>
        <span id="coord-y">Y: ?</span>
        <span class="mt-1 font-bold">FRAG_088</span>
    </div>

    <script>
        const asciiContainer = document.getElementById('ascii-container');
        const floatingLabel = document.getElementById('floating-label');
        const coordXLabel = document.getElementById('coord-x');
        const coordYLabel = document.getElementById('coord-y');

        // 사용할 아스키 문자셋 (밀도가 다른 문자들 섞기)
        const charSet = ['.', ',', ';', ':', '(', ')', '[', ']', '{', '}', '<', '>', '/', '\\', '|', '_', '+', '-', '*', '&', '%', '#', '@'];

        // 화면을 아스키아트로 가득 채우는 함수 (최초 1회만 실행하여 성능 극대화)
        function generateBackgroundText() {
            // 글자 하나의 대략적인 픽셀 면적 (폰트 사이즈와 자간 고려)
            const charArea = 14 * 16; 
            const screenArea = window.innerWidth * window.innerHeight;
            // 화면을 덮고도 남을 만큼 충분한 글자 수 계산
            const totalCharsNeeded = Math.ceil(screenArea / charArea) + 1000; 

            let randomString = '';
            for (let i = 0; i < totalCharsNeeded; i++) {
                const randomChar = charSet[Math.floor(Math.random() * charSet.length)];
                randomString += randomChar;
            }
            
            // 컨테이너에 한 번에 텍스트 삽입
            asciiContainer.textContent = randomString;
        }

        // 초기 생성
        generateBackgroundText();

        // 창 크기가 바뀔 때 혹시 텍스트가 모자라지 않게 다시 채움
        window.addEventListener('resize', generateBackgroundText);

        // 🎯 [핵심] 마우스 이동 시 CSS 마스크 좌표 실시간 업데이트
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // CSS 변수(--x, --y)에 마우스 좌표 전달 -> 마스크 위치 이동
            asciiContainer.style.setProperty('--x', `${x}px`);
            asciiContainer.style.setProperty('--y', `${y}px`);

            // 플로팅 라벨 위치 업데이트
            coordXLabel.innerText = `X: ${x}`;
            coordYLabel.innerText = `Y: ${y}`;

            // 라벨을 커서 바로 옆에 따라다니게 설정
            floatingLabel.style.left = `${x + 60}px`;
            floatingLabel.style.top = `${y - 20}px`;
            floatingLabel.style.opacity = '1';
        });

        // 마우스가 화면 밖으로 나가면 라벨 숨김
        document.addEventListener('mouseleave', () => {
            floatingLabel.style.opacity = '0';
        });

    </script>
</body>
</html>
