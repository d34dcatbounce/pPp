<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ASCII Cursor | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* 완전 블랙 배경 */
            color: #d1d5db; /* Monochromatic ASCII */
            /* Retro-tech monospaced font */
            font-family: 'Courier New', Courier, monospace;
        }

        /* 1. [가장 아래] 드러날 텍스처 레이어 (빈 여백) */
        #texture-layer {
            position: fixed;
            inset: 0;
            background-color: #333; /* 짙은 회색 스크린 텍스처색 */
            z-index: 1;
        }

        /* 2. [핵심] 아스키아트 배경 및 마스크 레이어 */
        #ascii-layer {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            /* 🎯 핵심: 이 캔버스의 globalCompositeOperation을 'destination-out'으로 설정하여 지우는 마스크로 사용 */
            pointer-events: none; /* 클릭 방해 안 하게 설정 */
        }

        /* 3. 상단 UI 라벨 */
        #header-label {
            position: absolute;
            top: 12px;
            left: 12px;
            text-align: left;
            opacity: 0.8;
            font-size: 14px;
            tracking-widest: 0.15em;
            z-index: 20;
            pointer-events: none;
        }

        /* 4. 하단 태그라인 */
        #tagline {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0.7;
            font-size: 14px;
            tracking-widest: 0.1em;
            z-index: 20;
            pointer-events: none;
        }

        /* 5. [수정됨] 마우스를 따라다니는 청록색(Cyan) 라벨 */
        #floating-label {
            position: fixed;
            pointer-events: none; /* 마우스 이벤트를 통과시킴 */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 30; /* 가장 위에 위치 */
            color: #06b6d4; /* 청록색 (Cyan) */
            text-shadow: 0 0 10px rgba(6,182,212,0.8);
            font-size: 12px;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="h-screen w-screen relative select-none">

    <div id="texture-layer"></div>

    <canvas id="ascii-layer"></canvas>

    <div id="header-label" class="text-white">
        [OFFICIAL ARCHIVE]<br>
        [DFA]
    </div>

    <div id="tagline" class="text-white uppercase">
        EXPLORE THE ASCII FIELD. MOVE THE MOUSE TO REVEAL EMPTY SPACE.
    </div>

    <div id="floating-label">
        <span id="coord-x">CURSOR_X_COORD: ?</span>
        <span id="coord-y">CURSOR_Y_COORD: ?</span>
        <span class="mt-1 font-bold">PROJECT_FRAGMENT_88 / ACTIVATE</span>
    </div>

    <script>
        // 캔버스 및 컨텍스트 세팅
        const canvas = document.getElementById('ascii-layer');
        const ctx = canvas.getContext('2d');
        const floatingLabel = document.getElementById('floating-label');
        const coordXLabel = document.getElementById('coord-x');
        const coordYLabel = document.getElementById('coord-y');

        let width, height;
        let asciiArtData = []; // 아스키아트 지형 데이터를 저장할 배열

        // 🎯 [핵심] 아스키아트 데이터 생성 (단색 지형 map_data.png를 아스크 아트로 재해석)
        // map_data.png의 흐르는 지형을 기호로 표현 (denser characters for walls, lighter for open space)
        const charSet = ['.', ',', ';', ':', '(', ')', '[', ']', '{', '}', '<', '>', '/', '\\', '|', '_'];
        const rows = 120; // 아스키아트 그리드 행 개수
        const cols = 200; // 아스키아트 그리드 열 개수

        function generateAsciiData() {
            asciiArtData = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // 미세한 랜덤 지형 구조 생성 (map_data.png의 패턴을 간략화)
                    // 중앙에서 멀어질수록  denser characters를 사용하여 지형 구조 표현
                    const distFromCenter = Math.hypot(c - cols/2, r - rows/2);
                    const normalizedDist = Math.max(0, 1 - (distFromCenter / (cols * 0.4)));
                    
                    // 지형 패턴에 따른 문자 선택
                    const charIndex = Math.floor(Math.random() * charSet.length);
                    // distFromCenter에 따른 denser/lighter 결정 (random으로 섞어서 visual texture 생성)
                    const finalCharIndex = Math.floor(charIndex * (normalizedDist * 0.5 + 0.5));
                    
                    asciiArtData.push(charSet[finalCharIndex]);
                }
            }
        }

        // 캔버스 리사이즈 및 지형 재생성
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateAsciiData();
            drawAsciiLayer(); // 지형을 처음 한 번 그림
        }
        window.addEventListener('resize', resize);
        resize();

        // 🎯 [핵심] 아스키아트 배경 지형 그리기 (Monochromatic)
        function drawAsciiLayer() {
            // 캔버스 초기화 ( destination-out으로 지울 것이므로, 
            // 아스키아트를 먼저 블랙 배경 위에 monochromatic 화이트로 그림 )
            ctx.fillStyle = '#111'; // monochromatic art 배경색
            ctx.fillRect(0, 0, width, height);

            // 🎯 [핵심 인터랙션] 마우스를 따라 지우기 효과 설정 (destination-out)
            // 지우기 작업을 위해 globalCompositeOperation을 'destination-out'으로 설정
            ctx.globalCompositeOperation = 'destination-out';
            
            // 🎯 [핵심] 지워진 원형 커서 그리기 (빈 여백)
            // 'destination-out' 모드에서는 원을 그리는 위치가 *지워져서* 드러남
            if (mouse.x > 0 && mouse.y > 0) {
                // 원형 마스크 그리기 (설계도의 Empty Space)
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 130, 0, Math.PI * 2); // 설계도와 동일하게 큰 원
                ctx.fill();
            }

            // 지우기 작업 후 다시 텍스트를 그리기 위해 'source-over'로 복구
            ctx.globalCompositeOperation = 'source-over';

            // monochromatic 아스키아트 그리기 (#eee 화이트/라이트 그레이)
            ctx.fillStyle = '#d1d5db'; 
            ctx.font = '16px "Courier New", Courier, monospace'; // monospaced retro font
            const cellW = width / cols;
            const cellH = height / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const char = asciiArtData[r * cols + c];
                    // cell 단위로 그리기
                    ctx.fillText(char, c * cellW, r * cellH + 16);
                }
            }
        }

        // 마우스 입력 처리
        let mouse = { x: -1000, y: -1000 }; // 초기값은 화면 밖

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            // 🎯 [핵심 인터랙션] 마우스를 따라 지워진 원을 매 프레임 다시 그리기
            drawAsciiLayer(); // 지우기 효과가 포함된 지형 다시 그리기

            // 🔥 [수정됨] 청록색(Cyan) 플로팅 라벨 위치 업데이트 및 표시
            coordXLabel.innerText = `CURSOR_X_COORD: ${mouse.x}`;
            coordYLabel.innerText = `CURSOR_Y_COORD: ${mouse.y}`;

            // 라벨 위치 (커서의 우측 상단)
            floatingLabel.style.left = `${mouse.x + 10}px`;
            floatingLabel.style.top = `${mouse.y - 45}px`;
            floatingLabel.style.opacity = '1';
        });

        // 씬 초기화 (첫 드로잉)
        drawAsciiLayer();

    </script>
</body>
</html>
