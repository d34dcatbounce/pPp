<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Negative Space Cursor | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff; /* 완전한 어둠 */
            cursor: none; /* 시스템 커서 숨김 */
        }

        /* 아스키 텍스트가 렌더링될 메인 그리드 */
        #grid {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            margin: 0; padding: 0;
            
            /* 타자기 폰트 (정렬 필수) */
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 14px;
            letter-spacing: 2px;
            
            color: #4b5563; /* 어두운 회색 (배경의 빽빽한 느낌) */
            white-space: pre; 
            pointer-events: none; 
            user-select: none;
        }

        /* UI 오버레이 */
        #ui-layer {
            position: absolute;
            top: 32px; left: 32px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            letter-spacing: 0.15em;
            color: #9ca3af;
            pointer-events: none;
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.7); /* 글자 위에 떠있어도 잘 보이게 패딩 */
            padding: 10px;
            border: 1px solid #374151;
        }
    </style>
</head>
<body class="h-screen w-screen relative">

    <div id="ui-layer">
        [ 088 : ASCII_CURSOR ]<br>
        RENDER_MODE: NEGATIVE_SPACE<br>
        <span id="coord" class="text-cyan-400 font-bold">COORD: [0, 0]</span>
    </div>

    <pre id="grid"></pre>

    <script>
        const gridEl = document.getElementById('grid');
        const coordEl = document.getElementById('coord');

        let charW, charH;
        let cols, rows;
        let baseGrid = []; // 기본 배경을 담을 2차원 배열

        // 🎯 빽빽한 배경을 구성할 문자들 (1과 0, 기호들 위주)
        const charSet = ['0', '1', 'H', 'X', 'Z', '#', '@', '%', '+', '=', ':', '.', '-', ' '];

        // 🎯 커서의 모양을 결정하는 '마스크' (X로 표시된 부분이 여백이 됨)
        const cursorMask = [
            "XX        ",
            "XXXX      ",
            "XXXXXX    ",
            "XXXXXXXX  ",
            "XXXXXXXXXX",
            "XXXXXXXXXX",
            "XXXXXX    ",
            "XX  XX    ",
            "    XX    ",
            "      XX  ",
            "      XX  "
        ];

        // 브라우저 폰트 폭/높이 측정
        function init() {
            const span = document.createElement('span');
            span.style.fontFamily = "'Courier New', Courier, monospace";
            span.style.fontSize = '14px';
            span.style.letterSpacing = '2px';
            span.innerText = 'X';
            document.body.appendChild(span);
            charW = span.getBoundingClientRect().width;
            charH = 14; 
            document.body.removeChild(span);

            resize();
        }

        // 화면 크기에 맞게 그리드 세팅
        function resize() {
            cols = Math.floor(window.innerWidth / charW);
            rows = Math.floor(window.innerHeight / charH) + 1;
            
            // 빽빽한 랜덤 텍스트로 배경 채우기
            baseGrid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    const randomChar = charSet[Math.floor(Math.random() * charSet.length)];
                    row.push(randomChar);
                }
                baseGrid.push(row);
            }
            render(-100, -100);
        }

        // 🎯 핵심 렌더링 로직
        function render(mouseX, mouseY) {
            let cX = Math.floor(mouseX / charW);
            let cY = Math.floor(mouseY / charH) - 1;

            let output = [];
            
            for (let r = 0; r < rows; r++) {
                let rowStr = '';
                for (let c = 0; c < cols; c++) {
                    let curR = r - cY;
                    let curC = c - cX;
                    
                    // 현재 문자가 마우스(커서 마스크) 위치에 해당하는지 검사
                    if (curR >= 0 && curR < cursorMask.length && curC >= 0 && curC < cursorMask[0].length) {
                        if (cursorMask[curR][curC] === 'X') {
                            // 마스크에 'X'라고 표시된 곳은 무조건 "공백(여백)"으로 치환
                            rowStr += ' ';
                        } else {
                            // 마스크 범위 안이지만 'X'가 아닌 곳은 배경 글자 그대로
                            rowStr += baseGrid[r][c];
                        }
                    } else {
                        // 커서 범위 밖은 배경 글자
                        rowStr += baseGrid[r][c];
                    }
                }
                output.push(rowStr);
            }

            // 완성된 텍스트 덩어리를 통째로 화면에 출력
            gridEl.textContent = output.join('\n');
            coordEl.textContent = `COORD: [${cX}, ${cY}]`;
        }

        let isUpdating = false;
        document.addEventListener('mousemove', (e) => {
            if (!isUpdating) {
                requestAnimationFrame(() => {
                    render(e.clientX, e.clientY);
                    isUpdating = false;
                });
                isUpdating = true;
            }
        });

        window.addEventListener('resize', resize);
        init();
    </script>
</body>
</html>
