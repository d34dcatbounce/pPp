<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Perfect Circle | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none; /* 모바일에서 스크롤 방지 */
        }
        
        #draw-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        #message-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            pointer-events: none; /* 글자 위에서도 그림이 그려지도록 */
            width: 100%;
        }

        .glitch-text {
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            color: #4b5563; /* 어두운 회색 */
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        /* 성공/실패 시 애니메이션 효과 */
        .success {
            color: #06b6d4;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.8);
        }
        .fail {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }
    </style>
</head>
<body class="select-none">

    <div id="message-container">
        <div id="status-text" class="glitch-text font-light tracking-widest">
            올바른 원을 그리면 나갈 수 있습니다.
        </div>
        <div id="score-display" class="text-xs text-gray-600 mt-4 font-mono opacity-0 transition-opacity">
            ACCURACY: 0.00%
        </div>
    </div>

    <canvas id="draw-canvas"></canvas>

    <div class="absolute top-8 left-8 text-gray-500 font-mono text-xs tracking-widest z-20 pointer-events-none">
        [ 077 : PERFECT_CIRCLE ]<br>
        MATHEMATICAL_VERIFICATION: STANDBY
    </div>

    <script>
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const scoreDisplay = document.getElementById('score-display');

        // 캔버스 사이즈 세팅
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let isDrawing = false;
        let points = []; // 그린 궤적의 좌표를 저장할 배열

        // 그리기 스타일 세팅
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';

        // --- 마우스 & 터치 이벤트 ---
        function startDrawing(e) {
            isDrawing = true;
            points = []; // 선을 새로 그릴 때 배열 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 캔버스 지우기
            statusText.className = 'glitch-text font-light tracking-widest';
            statusText.innerText = '올바른 원을 그리면 나갈 수 있습니다.';
            scoreDisplay.style.opacity = '0';
            
            const { x, y } = getCoordinates(e);
            points.push({ x, y });
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const { x, y } = getCoordinates(e);
            points.push({ x, y });
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.closePath();
            evaluateCircle(); // 선을 다 그리면 평가 시작
        }

        function getCoordinates(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);

        // --- [핵심] 수학적 원리 기반 원형 검증 알고리즘 ---
        function evaluateCircle() {
            if (points.length < 20) {
                fail("선이 너무 짧습니다. 다시 시도하세요.");
                return;
            }

            // 1. 도형이 닫혀있는가? (시작점과 끝점의 거리 계산)
            const firstPoint = points[0];
            const lastPoint = points[points.length - 1];
            const gapDistance = Math.hypot(lastPoint.x - firstPoint.x, lastPoint.y - firstPoint.y);
            
            if (gapDistance > 50) { // 50px 이상 벌어져 있으면 실패
                fail("도형이 완전히 닫히지 않았습니다.");
                return;
            }

            // 2. 실제 넓이와 둘레 계산 (Shoelace Formula 적용)
            let perimeter = 0;
            let actualArea = 0;

            for (let i = 0; i < points.length; i++) {
                const current = points[i];
                // 배열의 마지막 점은 다시 첫 번째 점과 연결하여 계산
                const next = points[(i + 1) % points.length]; 

                // 둘레 누적 (점과 점 사이의 거리)
                if (i < points.length - 1) {
                    perimeter += Math.hypot(next.x - current.x, next.y - current.y);
                }
                
                // 신발끈 공식을 위한 교차 곱 누적
                actualArea += (current.x * next.y) - (next.x * current.y);
            }
            actualArea = Math.abs(actualArea / 2);

            // 3. 그린 둘레(perimeter)를 바탕으로, '완벽한 원'이었을 때의 이론상 넓이 계산
            const theoreticalArea = (perimeter * perimeter) / (4 * Math.PI);

            // 4. 원형 일치도(Circularity) 도출 (실제 넓이 / 이론상 넓이)
            // 완벽한 원일수록 1에 가까워짐
            let score = actualArea / theoreticalArea;
            
            // 점수 표시
            scoreDisplay.innerText = `ACCURACY: ${(score * 100).toFixed(2)}%`;
            scoreDisplay.style.opacity = '1';

            // 90% 이상 일치해야 통과 (기준을 극악으로 높이려면 0.95로 변경)
            if (score > 0.90) {
                success();
            } else {
                fail("형태가 올바르지 않습니다.");
            }
        }

        // --- 상태 처리 함수 ---
        function fail(reason) {
            statusText.innerText = reason;
            statusText.className = 'glitch-text font-light tracking-widest fail';
            ctx.strokeStyle = '#ef4444'; // 그려진 선을 빨간색으로 변경
            ctx.stroke();
        }

        function success() {
            statusText.innerText = "접근 허가됨. 탈출 프로토콜을 가동합니다.";
            statusText.className = 'glitch-text font-light tracking-widest success';
            ctx.strokeStyle = '#06b6d4'; // 선을 청록색으로 변경
            ctx.stroke();
            
            // 2초 뒤에 메인 화면으로 이동하는 로직을 여기에 넣으면 됩니다!
            // setTimeout(() => { alert("메인 페이지로 이동!"); }, 2000);
        }
    </script>
</body>
</html>
