<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ASCII Circle | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* 완전한 어둠 */
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace; /* 타자기 폰트 통일 */
            touch-action: none; 
            cursor: none; /* 시스템 커서 숨김 */
        }
        
        #draw-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        /* 🎯 아스키 조준경 */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        #message-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            pointer-events: none;
            width: 100%;
        }

        .glitch-text {
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            color: #4b5563; 
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .success {
            color: #06b6d4;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.8);
        }
        .fail {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }
    </style>
</head>
<body class="select-none">

    <div id="custom-cursor">[ + ]</div>

    <div id="message-container">
        <div id="status-text" class="glitch-text uppercase font-bold tracking-widest">
            "DRAW_THE_PERFECT_SHAPE"
        </div>
        <div id="score-display" class="text-xs text-gray-600 mt-4 font-mono opacity-0 transition-opacity">
            ACCURACY: 0.00%
        </div>
    </div>

    <canvas id="draw-canvas"></canvas>

    <div class="absolute top-8 left-8 text-gray-500 font-mono text-xs tracking-widest z-20 pointer-events-none uppercase">
        [ 077 : ASCII_CIRCLE ]<br>
        MATHEMATICAL_VERIFICATION: STANDBY
    </div>

    <script>
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const scoreDisplay = document.getElementById('score-display');
        const customCursor = document.getElementById('custom-cursor');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let isDrawing = false;
        let points = []; 
        let lastPointTime = 0;

        // 🎯 궤적에 찍힐 무작위 아스키 문자들
        const inkChars = ['+', '*', ':', '.', '-', '~'];

        // 텍스트 그리기 세팅
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 14px 'Courier New', monospace";

        // 마우스 추적 (커서용)
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = `${e.clientX}px`;
            customCursor.style.top = `${e.clientY}px`;
        });

        function startDrawing(e) {
            isDrawing = true;
            points = []; 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            statusText.className = 'glitch-text uppercase font-bold tracking-widest';
            statusText.innerText = '"DRAW_THE_PERFECT_SHAPE"';
            scoreDisplay.style.opacity = '0';
            
            const { x, y } = getCoordinates(e);
            addPoint(x, y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const { x, y } = getCoordinates(e);
            
            // 🎯 글자들이 너무 겹치지 않게 일정 거리(12px) 이상 움직였을 때만 글자를 찍음
            const lastPoint = points[points.length - 1];
            const dist = Math.hypot(x - lastPoint.x, y - lastPoint.y);
            
            if (dist > 12) {
                addPoint(x, y);
            }
        }

        function addPoint(x, y) {
            points.push({ x, y });
            const char = inkChars[Math.floor(Math.random() * inkChars.length)];
            ctx.fillStyle = '#9ca3af'; // 기본 회색 잉크
            ctx.fillText(char, x, y);
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            evaluateCircle(); 
        }

        function getCoordinates(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);

        // 원형 검증 알고리즘 (수학 로직은 동일)
        function evaluateCircle() {
            if (points.length < 15) {
                fail("DATA_INSUFFICIENT");
                return;
            }

            const firstPoint = points[0];
            const lastPoint = points[points.length - 1];
            const gapDistance = Math.hypot(lastPoint.x - firstPoint.x, lastPoint.y - firstPoint.y);
            
            if (gapDistance > 80) { 
                fail("SHAPE_NOT_CLOSED");
                return;
            }

            let perimeter = 0;
            let actualArea = 0;

            for (let i = 0; i < points.length; i++) {
                const current = points[i];
                const next = points[(i + 1) % points.length]; 

                if (i < points.length - 1) {
                    perimeter += Math.hypot(next.x - current.x, next.y - current.y);
                }
                
                actualArea += (current.x * next.y) - (next.x * current.y);
            }
            actualArea = Math.abs(actualArea / 2);

            const theoreticalArea = (perimeter * perimeter) / (4 * Math.PI);
            let score = actualArea / theoreticalArea;
            
            scoreDisplay.innerText = `ACCURACY: ${(score * 100).toFixed(2)}%`;
            scoreDisplay.style.opacity = '1';

            if (score > 0.88) { // 아스키로 그리는 점을 감안해 난이도를 살짝 완화 (88%)
                success();
            } else {
                fail("ASYMMETRICAL_FORM_DETECTED");
            }
        }

        // 🎯 결과를 다시 그릴 때 선이 아닌 텍스트로 렌더링
        function redrawPoints(char, color, glow) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color;
            ctx.shadowBlur = glow;
            ctx.shadowColor = color;
            
            points.forEach(p => {
                ctx.fillText(char, p.x, p.y);
            });
            ctx.shadowBlur = 0;
        }

        function fail(reason) {
            statusText.innerText = reason;
            statusText.className = 'glitch-text font-bold tracking-widest fail';
            // 실패 시 빨간색 'X' 문자로 궤적을 덮어씌움
            redrawPoints('X', '#ef4444', 10);
        }

        function success() {
            statusText.innerText = "ACCESS_GRANTED. RETURNING_TO_MAIN.";
            statusText.className = 'glitch-text font-bold tracking-widest success';
            // 성공 시 빛나는 청록색 'O' 문자로 궤적을 덮어씌움
            redrawPoints('O', '#06b6d4', 15);
            
            setTimeout(() => { 
                window.location.href = 'index.html'; 
            }, 2500);
        }
    </script>
</body>
</html>
