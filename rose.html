<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Concrete Rose | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 세로 스크롤 완전 차단 */
            background-color: #050505; /* 초기 상태: 완전한 어둠 */
            font-family: 'Courier New', Courier, monospace;
            cursor: none; /* 시스템 커서 숨김 */
            transition: background-color 3s ease; /* 색상 복원 시 배경색 전환 */
        }

        /* 🎯 아스키 커서 디자인 */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            color: #4b5563; /* 초기 어두운 회색 */
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            transform: translate(-50%, -50%); /* 마우스 정중앙 정렬 */
            transition: color 2s ease, text-shadow 2s ease;
        }

        /* 가로 스크롤 트랙 */
        #horizontal-track {
            display: flex;
            align-items: flex-end; 
            height: 100vh;
            width: fit-content;
            padding-left: 10vw;
            padding-right: 50vw;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* 아스키 빌딩 컨테이너 */
        .building {
            flex-shrink: 0;
            margin-right: 16px; 
            color: #262626; /* 초기 상태: 죽어있는 콘크리트 색상 */
            font-size: 14px;
            line-height: 14px;
            letter-spacing: 2px;
            white-space: pre; 
            user-select: none;
            /* 🎯 색상 복원을 위한 트랜지션 설정 */
            transition: color 3s ease, text-shadow 3s ease;
        }

        /* 🎯 [핵심] 색상 복원 상태 (body에 클래스가 추가되면 발동) */
        body.color-restored {
            background-color: #020617; /* 깊은 밤하늘 색으로 전환 */
        }
        
        body.color-restored .building {
            /* JS에서 부여한 --neon-color 변수를 사용해 각 건물마다 다른 빛을 냄 */
            color: var(--neon-color);
            text-shadow: 0 0 10px var(--neon-color);
        }

        body.color-restored #custom-cursor {
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        body.color-restored #ui-layer {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 🎯 디테일해진 아스키 장미 */
        #the-rose {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #f43f5e; /* 로즈 핑크 */
            font-size: 14px;
            line-height: 12px;
            text-align: center;
            z-index: 50;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
            transition: transform 0.3s ease, text-shadow 0.3s ease, filter 2s ease;
            animation: pulse-rose 2s infinite alternate;
        }

        /* 마우스를 올릴 때 커질 수 있도록 투명한 클릭 영역 확보 */
        #the-rose::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            cursor: none;
        }

        #the-rose:hover {
            transform: translateX(-50%) scale(1.2);
            text-shadow: 0 0 20px rgba(244, 63, 94, 1);
        }

        /* 세상이 색을 찾으면 장미는 하얗게 타오름 */
        body.color-restored #the-rose {
            color: #fff;
            text-shadow: 0 0 30px #fff, 0 0 60px #f43f5e;
            animation: none;
            transform: translateX(-50%) scale(1.5);
        }

        @keyframes pulse-rose {
            0% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0 0 15px rgba(244, 63, 94, 0.8); }
        }

        /* UI 레이어 */
        #ui-layer {
            position: fixed;
            top: 32px; left: 32px;
            color: #4b5563;
            z-index: 100;
            pointer-events: none;
            text-transform: uppercase;
            transition: color 3s ease, text-shadow 3s ease;
        }

        #scroll-guide {
            position: fixed;
            bottom: 32px; right: 32px;
            color: #374151;
            font-size: 10px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        body.color-restored #scroll-guide {
            opacity: 0; /* 색을 찾으면 안내문구 사라짐 */
        }
    </style>
</head>
<body>

    <div id="custom-cursor">[ + ]</div>

    <div id="ui-layer">
        <div class="text-xs tracking-[0.2em] mb-1" id="ui-title">[ 025 : CONCRETE_ROSE ]</div>
        <div class="text-[10px] tracking-widest opacity-50" id="ui-subtitle">LOCATION: ASCII_URBAN_DESERT</div>
        <div class="mt-8 text-gray-500 text-sm tracking-tighter opacity-80" id="ui-status">"TXT_OVERRIDE: FIND_THE_ROSE"</div>
    </div>

    <div id="scroll-guide">WHEEL_TO_NAVIGATE //</div>

    <div id="horizontal-track">
        </div>

    <script>
        const track = document.getElementById('horizontal-track');
        const customCursor = document.getElementById('custom-cursor');
        const buildingCount = 120; 
        const rosePosition = Math.floor(Math.random() * 80) + 20; 

        // 🎯 세상이 되찾을 다채로운 네온 색상 팔레트
        const neonColors = ['#38bdf8', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#e879f9'];
        const blocks = ['█', '█', '█', '█', '▓', '▒'];

        for (let i = 0; i < buildingCount; i++) {
            const b = document.createElement('div');
            b.className = 'building';
            
            const cols = Math.floor(Math.random() * 8) + 4;  
            const rows = Math.floor(Math.random() * 40) + 10; 

            let buildingAscii = "";
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    buildingAscii += blocks[Math.floor(Math.random() * blocks.length)];
                }
                buildingAscii += "\n";
            }
            
            b.innerText = buildingAscii;

            // 🎯 각 건물마다 복원될 때 빛날 고유의 색상을 CSS 변수로 미리 숨겨둠
            const randomColor = neonColors[Math.floor(Math.random() * neonColors.length)];
            b.style.setProperty('--neon-color', randomColor);

            // 장미 배치
            if (i === rosePosition) {
                b.style.position = 'relative';
                const rose = document.createElement('div');
                rose.id = 'the-rose';
                
                // 🎯 디테일한 다중 줄 아스키 장미 아트
                rose.innerText = `  _  \n _(_)_\n(_)@(_)\n  (_)\\ \n     | \n     | `;
                
                // 장미 클릭 이벤트: 세상의 색깔 복원!
                rose.onclick = () => {
                    document.body.classList.add('color-restored');
                    
                    // UI 텍스트 변경
                    document.getElementById('ui-title').innerText = "[ SYSTEM_RESTORED ]";
                    document.getElementById('ui-subtitle').innerText = "COLOR_DATA_INJECTED";
                    document.getElementById('ui-status').innerText = "WORLD_LINE_RECOVERED.";
                    document.getElementById('ui-status').style.color = "#34d399"; // 초록색 텍스트

                    // 커서 모양 변경
                    customCursor.innerText = "[ ☼ ]";
                };

                // 마우스 호버 시 커서 모양 변경
                rose.addEventListener('mouseenter', () => customCursor.innerText = "< @ >");
                rose.addEventListener('mouseleave', () => {
                    if(!document.body.classList.contains('color-restored')) {
                        customCursor.innerText = "[ + ]";
                    }
                });
                
                b.appendChild(rose);
                b.style.marginRight = '40px';
                b.style.marginLeft = '20px';
            }

            track.appendChild(b);
        }

        // 🎯 커서 마우스 추적 로직
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = `${e.clientX}px`;
            customCursor.style.top = `${e.clientY}px`;
        });

        // 휠 가로 스크롤 매핑
        let scrollPos = 0;
        window.addEventListener('wheel', (e) => {
            scrollPos += e.deltaY * 1.5; 
            if (scrollPos < 0) scrollPos = 0;
            
            const maxScroll = track.scrollWidth - window.innerWidth;
            if (scrollPos > maxScroll) scrollPos = maxScroll;

            track.style.transform = `translateX(-${scrollPos}px)`;
        });
    </script>
</body>
</html>
