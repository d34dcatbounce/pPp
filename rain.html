<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Typographic Rain | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }

        /* 1. 떨어지는 '비' 글자 (타이포 파티클) */
        .rain-char {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 200;
            pointer-events: none;
            z-index: 1;
            /* 자바스크립트에서 설정한 떨어지는 시간(--fall-duration) 적용 */
            animation: textFall var(--fall-duration) linear infinite;
        }

        @keyframes textFall {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        /* 2. 중앙 메인 텍스트 컨테이너 */
        #text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 3. 중앙 문장을 구성하는 개별 글자 */
        .target-char {
            display: inline-block;
            transition: opacity 0.5s ease;
            white-space: pre; 
        }

        /* 4. 글자가 무너져 내리는 물리 효과 애니메이션 */
        .crumble {
            animation: collapse var(--duration) cubic-bezier(0.5, 0, 1, 1) forwards;
        }

        @keyframes collapse {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* 랜덤하게 퍼지며(var(--rx)), 바닥(100vh)으로 회전하며(var(--rr)) 떨어짐 */
                transform: translate(var(--rx), 100vh) rotate(var(--rr));
                opacity: 0;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative select-none">

    <div id="rain-container" class="absolute inset-0 pointer-events-none"></div>

    <div id="text-container" class="text-gray-200 text-2xl md:text-4xl font-light tracking-widest">
        </div>

    <div class="absolute top-8 left-8 text-gray-600 font-mono text-xs tracking-widest z-20 pointer-events-none">
        [ 044 : TYPOGRAPHIC_RAIN ]<br>
        STRUCTURAL_INTEGRITY: COMPROMISED
    </div>

    <button onclick="resetScene()" class="absolute bottom-8 right-8 z-20 text-[10px] font-mono font-bold border border-gray-600 text-gray-500 px-3 py-1 hover:bg-white hover:text-black transition-colors uppercase tracking-widest">
        Rebuild Structure
    </button>

    <script>
        // --- 1. 중앙 문장 세팅 및 무너짐(Collapse) 로직 ---
        const textContainer = document.getElementById('text-container');
        const sentence = "이제부터 비가 내릴 거에요.";
        let targetChars = [];
        let collapseTimeout;

        function buildText() {
            textContainer.innerHTML = '';
            targetChars = [];
            
            // 문장을 한 글자씩 쪼개서 span 태그로 감쌈
            sentence.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerText = char;
                span.className = 'target-char';
                textContainer.appendChild(span);
                targetChars.push(span);
            });
        }

        function triggerCollapse() {
            targetChars.forEach((span) => {
                const randomX = (Math.random() - 0.5) * 200; // 좌우 퍼짐 (-100px ~ 100px)
                const randomRotate = (Math.random() - 0.5) * 180; // 회전 (-90도 ~ 90도)
                const randomDuration = 1 + Math.random() * 1.5; // 추락 시간 (1~2.5초)
                const randomDelay = Math.random() * 2000; // 지연 시간 (0~2초)

                span.style.setProperty('--rx', `${randomX}px`);
                span.style.setProperty('--rr', `${randomRotate}deg`);
                span.style.setProperty('--duration', `${randomDuration}s`);

                setTimeout(() => {
                    span.classList.add('crumble');
                }, randomDelay);
            });
        }

        // --- 2. '비' 글자 파티클(Rain) 로직 ---
        const rainContainer = document.getElementById('rain-container');
        const totalRaindrops = 150; // 떨어지는 '비' 글자의 개수

        function createRain() {
            rainContainer.innerHTML = ''; // 기존 비 지우기
            
            for (let i = 0; i < totalRaindrops; i++) {
                const drop = document.createElement('div');
                drop.className = 'rain-char';
                drop.innerText = '비'; // 쏟아질 글자 지정
                
                // 랜덤 위치 (화면 가로 100% 안에서)
                const leftPos = Math.random() * 100;
                // 랜덤 크기 (10px ~ 24px)
                const fontSize = Math.random() * 14 + 10;
                // 떨어지는 속도 (2초 ~ 5초 사이, 멀리 있는 작은 글씨일수록 느리게)
                const fallDuration = (Math.random() * 3 + 2) + (24 / fontSize);
                // 애니메이션 시작 딜레이 (동시에 떨어지지 않도록)
                const delay = Math.random() * -5; // 음수로 주어 처음부터 화면에 퍼져있게 함
                // 투명도 (멀리 있는 작은 글씨는 더 투명하게)
                const opacity = (fontSize / 24) * 0.6 + 0.1;

                drop.style.left = `${leftPos}vw`;
                drop.style.fontSize = `${fontSize}px`;
                drop.style.animationDelay = `${delay}s`;
                
                // CSS 변수로 속성값 전달
                drop.style.setProperty('--fall-duration', `${fallDuration}s`);
                drop.style.setProperty('--max-opacity', opacity);

                rainContainer.appendChild(drop);
            }
        }

        // --- 3. 씬 제어 ---
        function resetScene() {
            clearTimeout(collapseTimeout);
            buildText();       // 문장 다시 세우기
            createRain();      // 비 다시 내리게 하기
            
            // 3.5초간 비를 맞은 후 문장이 무너지기 시작
            collapseTimeout = setTimeout(triggerCollapse, 3500);
        }

        // 페이지 로드 시 초기 실행
        resetScene();

    </script>
</body>
</html>
