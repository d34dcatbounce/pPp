<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Tempo Regulator | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #d1d5db;
        }

        /* 중앙 펄스 애니메이션 링 */
        #pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 2px solid #06b6d4; /* 청록색 */
            opacity: 0;
            pointer-events: none;
        }

        /* JS에서 이 클래스를 붙였다 떼면서 애니메이션을 발생시킴 */
        .beat-anim {
            animation: pulse-out 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes pulse-out {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; border-width: 5px; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; border-width: 1px; }
        }

        /* 메인 버튼 UI */
        #play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            border-radius: 50%;
            background-color: transparent;
            border: 1px dashed #4b5563;
            color: #9ca3af;
            font-size: 14px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #play-btn:hover {
            border-color: #06b6d4;
            color: #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        #play-btn.active {
            border-color: #06b6d4;
            border-style: solid;
            color: #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }

        /* 슬라이더 커스텀 스타일 */
        input[type=range] {
            -webkit-appearance: none;
            width: 300px;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        /* 트랙(선) */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #374151;
        }
        /* 썸(손잡이) */
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 8px;
            background: #06b6d4;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
        }

        /* UI 레이어 */
        #ui-layer {
            position: fixed;
            top: 32px; left: 32px;
            pointer-events: none;
        }
    </style>
</head>
<body class="h-screen w-screen relative select-none">

    <div id="ui-layer">
        <div class="text-xs tracking-[0.2em] mb-1 text-gray-500">[ 060 : TEMPO_REGULATOR ]</div>
        <div class="text-[10px] tracking-widest text-gray-600 uppercase">SYSTEM_CLOCK_SYNC</div>
        <div class="mt-6 text-cyan-500 text-sm tracking-widest font-bold" id="interval-display">INTERVAL: 500.00 ms</div>
    </div>

    <div id="pulse-ring"></div>

    <button id="play-btn">INITIATE</button>

    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex flex-col items-center">
        <div class="text-3xl font-light tracking-widest mb-4" id="bpm-display">120 <span class="text-sm text-gray-500">BPM</span></div>
        <input type="range" id="bpm-slider" min="40" max="240" value="120">
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const bpmDisplay = document.getElementById('bpm-display');
        const bpmSlider = document.getElementById('bpm-slider');
        const intervalDisplay = document.getElementById('interval-display');
        const pulseRing = document.getElementById('pulse-ring');

        // Web Audio API Context
        let audioCtx;
        
        let isPlaying = false;
        let tempo = 120.0;
        let nextNoteTime = 0.0; 
        let timerID;

        // 🎯 [핵심] 스케줄링 설정값
        const lookahead = 25.0; // 타이머 호출 간격 (ms)
        const scheduleAheadTime = 0.1; // 미리 예약할 시간 (초)

        // BPM 값이 변경될 때마다 화면과 변수 업데이트
        bpmSlider.addEventListener('input', function() {
            tempo = this.value;
            bpmDisplay.innerHTML = `${tempo} <span class="text-sm text-gray-500">BPM</span>`;
            
            // ms 계산 (60000ms / BPM)
            const ms = (60000 / tempo).toFixed(2);
            intervalDisplay.innerText = `INTERVAL: ${ms} ms`;
        });

        // 다음 박자 시간을 계산
        function nextNote() {
            const secondsPerBeat = 60.0 / tempo;
            nextNoteTime += secondsPerBeat;
        }

        // 특정 시간에 비프음과 시각적 파동 예약
        function scheduleNote(time) {
            // 1. 오디오 노드 생성 (비프음)
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // 주파수(음높이)와 파형 설정
            osc.frequency.value = 880.0; // A5 음
            osc.type = 'sine';

            // 볼륨 엔벨로프 (날카로운 '틱' 소리를 만들기 위해 볼륨을 급격히 줄임)
            gainNode.gain.setValueAtTime(1, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

            osc.start(time);
            osc.stop(time + 0.05);

            // 2. 시각적 펄스 예약 (시간차 계산)
            // AudioContext의 시간과 브라우저 타이머의 시간차를 계산하여 파동 애니메이션 실행
            const timeUntilNote = (time - audioCtx.currentTime) * 1000;
            setTimeout(() => {
                // 애니메이션 리셋 꼼수 (클래스를 뺐다 다시 넣음)
                pulseRing.classList.remove('beat-anim');
                void pulseRing.offsetWidth; 
                pulseRing.classList.add('beat-anim');
            }, Math.max(0, timeUntilNote));
        }

        // 스케줄러 루프
        function scheduler() {
            // 재생해야 할 시간이 현재 시간 + 예약 시간 안에 들어오면
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNote(nextNoteTime);
                nextNote(); // 다음 시간 계산
            }
        }

        // 재생 / 정지 토글
        playBtn.addEventListener('click', function() {
            if (!audioCtx) {
                // 사용자 제스처(클릭) 시에 AudioContext를 초기화해야 소리가 납니다.
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            isPlaying = !isPlaying;

            if (isPlaying) {
                // 상태 변경 시 브라우저 정책에 의해 suspended 된 오디오를 깨움
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                playBtn.innerText = 'HALT_SYNC';
                playBtn.classList.add('active');
                
                // 지금부터 바로 첫 박자 시작
                nextNoteTime = audioCtx.currentTime + 0.05;
                timerID = setInterval(scheduler, lookahead);
            } else {
                playBtn.innerText = 'INITIATE';
                playBtn.classList.remove('active');
                clearInterval(timerID);
            }
        });
    </script>
</body>
</html>
