<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Typo Cursor | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #9ca3af;
            cursor: none; /* 🎯 브라우저 기본 커서 완전 삭제 */
        }

        /* 🎯 아스키 커서 (마우스를 따라다니는 텍스트) */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            z-index: 9999;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            white-space: pre;
            transition: color 0.2s, text-shadow 0.2s;
        }

        /* 아스키 선택 카드 스타일 */
        .cursor-card {
            transition: all 0.2s ease;
            border: 1px solid #1f2937; /* 어두운 회색 테두리 */
            background-color: transparent;
            cursor: none;
        }
        
        .cursor-card:hover {
            background-color: rgba(6, 182, 212, 0.05);
            border-color: #06b6d4;
            color: #06b6d4;
        }

        .active-cursor {
            background-color: rgba(6, 182, 212, 0.1) !important;
            border-color: #06b6d4 !important;
            color: #fff !important;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 32px; left: 32px;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-10 select-none">

    <div id="custom-cursor">[ + ]</div>

    <div id="ui-layer" class="w-full">
        <div class="text-xs tracking-[0.2em] mb-1 text-gray-500">[ 013 : TYPO_CURSOR ]</div>
        <div class="text-[10px] tracking-widest uppercase opacity-50">POINTER_OVERRIDE_SYSTEM</div>
    </div>

    <div class="text-center mb-12 mt-10 w-full max-w-4xl">
        <div class="text-cyan-500 text-sm tracking-widest font-bold mb-4 uppercase" id="current-status">CURRENT_POINTER : [ + ]</div>
        <p class="text-[10px] text-gray-600 tracking-[0.3em] uppercase">Select ASCII configuration for interaction tracking.</p>
    </div>

    <div id="cursor-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2 w-full max-w-4xl">
        </div>

    <div class="mt-12 p-4 border-t border-gray-800 w-full max-w-4xl flex justify-between items-center">
        <span class="text-[10px] font-mono text-gray-600 tracking-widest">SYSTEM_READY</span>
        <button onclick="resetCursor()" class="text-[10px] font-bold border border-gray-700 text-gray-400 px-4 py-2 hover:bg-gray-800 hover:text-white transition-colors cursor-none tracking-widest uppercase">
            RESTORE_DEFAULT
        </button>
    </div>

    <script>
        // 🎯 [핵심] 타이포 & 아스키 컨셉에 맞춘 커서 세트
        const asciiCursors = [
            { id: '[ + ]', desc: 'PRECISION_AIM' },
            { id: '>_', desc: 'CMD_PROMPT' },
            { id: '{ }', desc: 'DATA_WRAPPER' },
            { id: '< >', desc: 'NODE_NAVIGATOR' },
            { id: '///', desc: 'SLASH_DRIFT' },
            { id: 'X', desc: 'VOID_POINTER' },
            { id: '---', desc: 'FLAT_LINE' },
            { id: '?', desc: 'QUERY_STATE' }
        ];

        const grid = document.getElementById('cursor-grid');
        const status = document.getElementById('current-status');
        const customCursor = document.getElementById('custom-cursor');

        // 마우스 이동 추적
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = `${e.clientX}px`;
            customCursor.style.top = `${e.clientY}px`;
        });

        // 카드 생성 루프
        asciiCursors.forEach((type, index) => {
            const card = document.createElement('div');
            // 첫 번째 옵션을 기본 활성화 상태로 설정
            const isActive = index === 0 ? 'active-cursor' : '';
            
            card.className = `cursor-card p-6 flex flex-col items-center justify-center rounded-none ${isActive}`;
            
            card.innerHTML = `
                <span class="text-xl mb-3 font-bold text-white tracking-widest">${type.id}</span>
                <span class="text-[9px] text-gray-500 mt-1 uppercase tracking-widest">${type.desc}</span>
            `;

            // 클릭 시 전역 커서(텍스트) 변경
            card.onclick = () => {
                document.querySelectorAll('.cursor-card').forEach(c => c.classList.remove('active-cursor'));
                
                // 마우스를 따라다니는 아스키 텍스트 변경
                customCursor.innerText = type.id;
                
                card.classList.add('active-cursor');
                status.innerText = `CURRENT_POINTER : ${type.id}`;

                // 클릭 효과음 대신 화면 살짝 번쩍이는 효과
                customCursor.style.color = '#06b6d4';
                setTimeout(() => customCursor.style.color = '#fff', 150);
            };

            // 그리드 영역 호버 시 임시로 커서 모양 바꿔주기 (미리보기)
            card.addEventListener('mouseenter', () => {
                if (!card.classList.contains('active-cursor')) {
                    customCursor.innerText = type.id;
                    customCursor.style.color = '#9ca3af'; // 회색으로 미리보기
                }
            });

            card.addEventListener('mouseleave', () => {
                // 원래 선택되어 있던 커서로 복구
                const activeId = status.innerText.split(' : ')[1];
                customCursor.innerText = activeId;
                customCursor.style.color = '#fff';
            });

            grid.appendChild(card);
        });

        // 리셋 함수
        function resetCursor() {
            const firstCard = grid.firstChild;
            firstCard.click(); // 첫 번째 기본 옵션 클릭 트리거
        }
    </script>
</body>
</html>
