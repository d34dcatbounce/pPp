<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Parallax Void | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* 완전한 어둠 */
            font-family: 'Courier New', Courier, monospace;
            cursor: none; /* 시스템 커서 숨김 */
        }

        #void-canvas {
            display: block;
        }

        /* 아스키 조준경 커서 */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 32px; left: 32px;
            color: #4b5563;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="select-none">

    <div id="custom-cursor">&lt; 0 &gt;</div>

    <div id="ui-layer">
        <div class="text-xs tracking-[0.2em] mb-1">[ 039 : PARALLAX_VOID ]</div>
        <div class="text-[10px] tracking-widest opacity-50 uppercase">OPTICAL_ILLUSION: DEPTH_MAPPING</div>
        <div id="status-text" class="text-cyan-500 text-xs mt-6 font-bold tracking-tighter">DATA_CORE_EXPOSED</div>
    </div>

    <div class="absolute bottom-8 w-full text-center text-[10px] text-gray-700 tracking-[0.3em] uppercase pointer-events-none">
        Move cursor to alter perspective and peer into the void.
    </div>

    <canvas id="void-canvas"></canvas>

    <script>
        const canvas = document.getElementById('void-canvas');
        const ctx = canvas.getContext('2d');
        const customCursor = document.getElementById('custom-cursor');

        let width, height;
        let cols, rows;
        
        // 폰트 크기 및 셀 규격 (고정폭)
        const charW = 14;
        const charH = 16;
        const aspectRatio = charW / charH; // 완벽한 원형 구멍을 뚫기 위한 비율 보정

        // 마우스 추적 (Lerp로 부드럽게 따라오도록 타겟 값과 현재 값을 분리)
        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;

        // 노이즈 맵 (글자가 깜빡거리지 않게 고정된 난수 배열 생성)
        let noiseMap = [];

        // 🎯 4개의 층(Layer) 정의
        // 속도(speed)가 클수록 화면에 가깝게(빠르게) 움직이는 것처럼 보입니다.
        // 구멍(holeRadius)이 작아질수록 더 깊은 층임을 의미합니다.
        const layers = [
            { id: 0, speed: 0.02, holeRadius: 0,  color: '#06b6d4', chars: '01', glow: 10 },        // 바닥 (가장 깊고 빛나는 코어)
            { id: 1, speed: 0.08, holeRadius: 5,  color: '#4b5563', chars: '+*xo:', glow: 0 },      // 하층부
            { id: 2, speed: 0.18, holeRadius: 10, color: '#1f2937', chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', glow: 0 }, // 중층부
            { id: 3, speed: 0.35, holeRadius: 16, color: '#0a0a0a', chars: '█▓▒', glow: 0 }         // 표면 (가장 크고 어두운 블록, 마우스에 가장 크게 반응)
        ];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            // 마우스를 가장자리에 갖다 댔을 때 화면 끝이 잘리지 않도록 여유 공간(+40)을 두고 격자 생성
            cols = Math.ceil(width / charW) + 40;
            rows = Math.ceil(height / charH) + 40;

            // 난수 맵 초기화
            noiseMap = [];
            for (let r = 0; r < rows; r++) {
                let rowArray = [];
                for (let c = 0; c < cols; c++) {
                    rowArray.push(Math.random());
                }
                noiseMap.push(rowArray);
            }

            // 초기 마우스 위치를 중앙으로 세팅
            mouseX = currentX = width / 2;
            mouseY = currentY = height / 2;
        }

        window.addEventListener('resize', init);

        // 마우스 위치 업데이트
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // 실제 아스키 커서는 즉시 따라감
            customCursor.style.left = `${mouseX}px`;
            customCursor.style.top = `${mouseY}px`;
        });

        // 🎯 핵심: 시차 렌더링 루프
        function animate() {
            // Lerp (선형 보간)를 이용해 시차 이동을 물 흐르듯 부드럽게 만듦
            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;

            // 화면 중앙을 0,0 기준으로 정규화
            const dx = currentX - width / 2;
            const dy = currentY - height / 2;

            // 캔버스 초기화
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 14px 'Courier New', monospace";

            const centerC = cols / 2;
            const centerR = rows / 2;

            // 바닥층(0)부터 표면층(3)까지 순서대로 쌓아 올림
            for (let l = 0; l < layers.length; l++) {
                const layer = layers[l];
                
                // 최적화: 레이어 단위로 폰트 색상과 글로우 한 번만 설정
                ctx.fillStyle = layer.color;
                if (layer.glow > 0) {
                    ctx.shadowBlur = layer.glow;
                    ctx.shadowColor = layer.color;
                } else {
                    ctx.shadowBlur = 0;
                }

                // 각 층의 이동 속도(speed)에 비례하여 격자 전체의 오프셋 결정
                const offsetX = dx * layer.speed;
                const offsetY = dy * layer.speed;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // 구멍(Void) 판정: 중앙으로부터의 거리 계산
                        // 텍스트 비율에 맞게 타원이 아닌 완벽한 원형으로 뚫리도록 aspectRatio 보정
                        const dist = Math.hypot((c - centerC) * aspectRatio, r - centerR);
                        
                        // 현재 좌표가 해당 레이어의 구멍 반경 안에 있으면 그리지 않고 패스 (아래 층이 보이게 됨)
                        if (dist < layer.holeRadius) {
                            continue;
                        }

                        // 난수 맵을 이용해 텍스트 집합에서 기호 선택
                        const rand = noiseMap[r][c];
                        const charIdx = Math.floor(rand * layer.chars.length);
                        const char = layer.chars[charIdx];

                        // 화면 좌표 계산 (여유 공간 20칸만큼 위/왼쪽으로 당겨서 그림)
                        const x = (c - 20) * charW - offsetX;
                        const y = (r - 20) * charH - offsetY;

                        // 화면(Viewport) 바깥으로 나간 글자는 렌더링 생략 (최적화)
                        if (x < -20 || x > width + 20 || y < -20 || y > height + 20) continue;

                        ctx.fillText(char, x, y);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
