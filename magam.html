<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마감에 쫓기듯 | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Noto Serif KR', serif;
        }

        /* 🎯 [수정됨] 11x4 그리드로 확장 (총 44칸) */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(11, 70px);
            grid-template-rows: repeat(4, 70px);
            gap: 8px;
            z-index: 10;
        }

        /* 🎯 [수정됨] 칸 크기와 폰트 사이즈 조정 */
        .cell {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 1px solid #222;
            transition: all 0.4s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.8);
            filter: blur(5px);
        }

        .typing {
            color: #06b6d4;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative select-none">

    <div class="absolute top-12 left-12 text-gray-500 font-mono text-xs tracking-widest z-20">
        [ 061 : DEADLINE_PRESSURE ]<br>
        BUFFER_CAPACITY: 22_CHARS
    </div>

    <h1 class="absolute top-24 text-xl font-light tracking-[0.5em] text-gray-400">마감에 쫓기듯</h1>

    <div id="grid-container">
        </div>

    <input type="text" id="hidden-input" autofocus>

    <div class="absolute bottom-12 text-gray-700 font-mono text-[10px] tracking-widest uppercase text-center w-full">
        Click anywhere to focus and start typing. Maximum visibility limited to 22 characters.
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const hiddenInput = document.getElementById('hidden-input');
        const cells = [];
        const committedChars = [];
        let globalCursor = 0; 

        // 🎯 [설정값] 그리드 크기 및 기본 텍스트 세팅
        const defaultText = "우리가 저장할 수 있는 정보에는 한계가 있습니다.";
        const maxVisibility = defaultText.length; // 22글자
        const totalCells = 44; // 11열 * 4행

        // 1. 그리드 초기화 (44칸 생성)
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            gridContainer.appendChild(cell);
            cells.push(cell);
        }

        // 🎯 2. 기본 텍스트 삽입 로직
        for (let char of defaultText) {
            committedChars[globalCursor] = char;
            globalCursor++;
        }

        document.addEventListener('click', () => hiddenInput.focus());

        // 3. 입력 이벤트 처리
        let isComposing = false;

        hiddenInput.addEventListener('compositionstart', () => {
            isComposing = true;
        });

        hiddenInput.addEventListener('compositionupdate', (e) => {
            renderGrid(e.data, true);
        });

        hiddenInput.addEventListener('compositionend', (e) => {
            isComposing = false;
            if (e.data) {
                committedChars[globalCursor] = e.data;
                globalCursor++;
                hiddenInput.value = '';
                renderGrid('', false);
            }
        });

        hiddenInput.addEventListener('input', (e) => {
            if (!isComposing && hiddenInput.value) {
                for (let char of hiddenInput.value) {
                    committedChars[globalCursor] = char;
                    globalCursor++;
                }
                hiddenInput.value = '';
                renderGrid('', false);
            }
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !isComposing) {
                if (globalCursor > 0) {
                    globalCursor--;
                    hiddenInput.value = '';
                    renderGrid('', false);
                }
            }
        });

        // 4. 렌더링 로직 (최대 22글자 유지)
        function renderGrid(currentTyping, isComposing) {
            cells.forEach(cell => {
                cell.innerText = '';
                cell.classList.remove('typing');
            });

            let start, end;
            if (isComposing) {
                start = Math.max(0, globalCursor - (maxVisibility - 1));
                end = globalCursor - 1;
            } else {
                start = Math.max(0, globalCursor - maxVisibility);
                end = globalCursor - 1;
            }

            for (let i = start; i <= end; i++) {
                const cellIndex = i % totalCells; // 44칸 순회
                cells[cellIndex].innerText = committedChars[i];
            }

            if (isComposing && currentTyping) {
                const cellIndex = globalCursor % totalCells;
                cells[cellIndex].innerText = currentTyping;
                cells[cellIndex].classList.add('typing');
            }
        }

        // 초기 화면에 기본 텍스트 렌더링
        renderGrid('', false);
        hiddenInput.focus();
    </script>
</body>
</html>
