<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Data Recovery | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            cursor: crosshair;
        }

        /* 텍스트 기본 뼈대 */
        .text-base {
            width: 100vw; height: 100vh;
            padding: 40px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 0.1em;
            word-break: break-all;
            white-space: pre-wrap;
            pointer-events: none;
        }

        /* 1. 🎯 [수정됨] 요동치는 CSS 삭제, 정적으로 고정된 에러 레이어 */
        #noisy-layer {
            position: fixed;
            top: 0; left: 0;
            z-index: 10;
            color: #ef4444; /* 치명적인 에러 레드 */
        }

        /* 2. 드래그할 때 보이는 캡처 상자 */
        #selection-box {
            position: fixed;
            border: 1px dashed #fff;
            background-color: rgba(255, 255, 255, 0.1);
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        /* 3. 복구된 구역의 스타일 (창문) */
        .recovered-block {
            position: fixed;
            overflow: hidden; 
            background-color: #050505; 
            z-index: 20;
            border: 1px solid rgba(6, 182, 212, 0.4);
            box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.1);
            pointer-events: none;
        }

        /* 창문 안에 들어갈 깨끗한 텍스트 */
        .clean-clone {
            position: absolute;
            color: #9ca3af; /* 차분하고 선명한 회색 */
        }
    </style>
</head>
<body class="select-none h-screen w-screen relative">

    <div id="noisy-layer" class="text-base"></div>

    <div id="selection-box"></div>

    <div class="absolute top-8 left-8 text-white font-mono text-xs tracking-widest z-[60] bg-black/80 px-2 py-1 pointer-events-none border border-gray-800">
        [ 056 : DATA_RECOVERY ]<br>
        CORRUPTION_LEVEL: CRITICAL<br>
        <span id="cleared-count" class="text-cyan-400">RECOVERED_SECTORS: 0</span>
    </div>
    
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 text-white font-mono text-[10px] tracking-widest z-[60] bg-black/80 px-4 py-2 pointer-events-none uppercase border border-gray-800">
        DRAG TO ISOLATE AND RECOVER CORRUPTED DATA BLOCKS.
    </div>

    <script>
        // 1. 더미 텍스트 세팅
        const dummyText = `[ SYSTEM LOG 409-B ] WARNING: SUBSTRATE INTEGRITY COMPROMISED. \nUNAUTHORIZED ENTITY DETECTED IN SECTOR 7. INITIATING QUARANTINE PROTOCOL... FAILED. \nDATA STREAM CORRUPTED. ATTEMPTING MANUAL OVERRIDE... \n\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. \n\n[ MEMORY DUMP ]\n0x00A1: FF 00 2A 4B 99 \n0x00A2: CORRUPTED_BLOCK \n0x00A3: 11 22 33 44 55 \n\n`.repeat(15);
        
        const noisyLayer = document.getElementById('noisy-layer');
        const symbols = "@#$%&*?!><{}[]+=/\\|";

        // 🎯 [핵심 추가] 텍스트를 기호로 실시간 치환하는 로직 (60ms마다 갱신)
        setInterval(() => {
            let scrambled = '';
            for (let i = 0; i < dummyText.length; i++) {
                const char = dummyText[i];
                // 줄바꿈과 띄어쓰기는 유지하여 레이아웃이 무너지지 않게 함
                if (char === ' ' || char === '\n') {
                    scrambled += char;
                } else {
                    // 80% 확률로 특수기호로 치환, 20% 확률로 원본 글자 노출 (더 사실적인 글리치 느낌)
                    if (Math.random() > 0.2) {
                        scrambled += symbols[Math.floor(Math.random() * symbols.length)];
                    } else {
                        scrambled += char;
                    }
                }
            }
            noisyLayer.innerText = scrambled;
        }, 60); 

        // 2. 캡처 도구 로직
        const selectionBox = document.getElementById('selection-box');
        const clearedCountDisplay = document.getElementById('cleared-count');
        
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let clearCount = 0;

        document.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;

            selectionBox.style.left = `${startX}px`;
            selectionBox.style.top = `${startY}px`;
            selectionBox.style.width = '0px';
            selectionBox.style.height = '0px';
            selectionBox.style.display = 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const currentX = e.clientX;
            const currentY = e.clientY;

            const left = Math.min(startX, currentX);
            const top = Math.min(startY, currentY);
            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);

            selectionBox.style.left = `${left}px`;
            selectionBox.style.top = `${top}px`;
            selectionBox.style.width = `${width}px`;
            selectionBox.style.height = `${height}px`;
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            selectionBox.style.display = 'none';

            const endX = e.clientX;
            const endY = e.clientY;
            
            const left = Math.min(startX, endX);
            const top = Math.min(startY, endY);
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);

            if (width > 10 && height > 10) {
                
                // 1. 노이즈를 가려버릴 창문(블록) 생성
                const block = document.createElement('div');
                block.className = 'recovered-block';
                block.style.left = `${left}px`;
                block.style.top = `${top}px`;
                block.style.width = `${width}px`;
                block.style.height = `${height}px`;

                // 2. 창문 안에 넣을 깨끗한 텍스트 클론 생성
                const cleanText = document.createElement('div');
                cleanText.className = 'text-base clean-clone';
                // 🎯 복구된 창문 안에는 변형되지 않은 원본 dummyText를 넣습니다.
                cleanText.innerText = dummyText; 
                
                // 마이너스 좌표로 전체 화면 기준 제자리에 위치시킴
                cleanText.style.left = `-${left}px`;
                cleanText.style.top = `-${top}px`;

                block.appendChild(cleanText);
                document.body.appendChild(block);

                clearCount++;
                clearedCountDisplay.innerText = `RECOVERED_SECTORS: ${clearCount}`;
            }
        });
    </script>
</body>
</html>
