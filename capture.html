<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Noise Eraser | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #d1d5db;
            /* 캡처 도구 느낌을 위한 십자선 커서 */
            cursor: crosshair;
        }

        /* 1. [가장 아래] 숨겨진 기밀 데이터 레이어 */
        #secret-data {
            position: fixed;
            inset: 0;
            background-color: #0f172a; /* 짙은 네이비 배경 */
            /* 도면 같은 모눈종이 패턴 */
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* 2. [중간] 화면을 덮고 있는 노이즈 레이어 */
        #noise-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            /* SVG 필터를 이용한 TV 노이즈(Static) 생성 */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.9;
            /* 자글자글한 애니메이션 효과 */
            animation: noiseJitter 0.2s infinite linear;
            
            /* 🎯 핵심: SVG 마스크 적용 (검은색으로 칠해진 곳만 투명해짐) */
            -webkit-mask-image: url(#eraser-mask);
            mask-image: url(#eraser-mask);
            pointer-events: none; /* 클릭 방해 안 하게 설정 */
        }

        @keyframes noiseJitter {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }

        /* 3. [맨 위] 드래그할 때 보이는 선택 영역 상자 */
        #selection-box {
            position: fixed;
            border: 1px dashed #fff;
            background-color: rgba(255, 255, 255, 0.1);
            z-index: 50;
            pointer-events: none; /* 드래그 중 마우스 이벤트를 가로채지 않게 */
            display: none; /* 평소엔 숨김 */
        }
    </style>
</head>
<body class="select-none h-screen w-screen relative">

    <div id="secret-data">
        <h1 class="text-6xl font-black text-cyan-500 tracking-[0.2em] mb-4 opacity-80" style="text-shadow: 0 0 20px rgba(6,182,212,0.5);">RESTRICTED</h1>
        <p class="text-cyan-800 font-mono text-xl tracking-widest uppercase text-center max-w-2xl leading-relaxed">
            Project_Fragment_056 contains classified blueprints.<br>
            Unauthorized access is strictly prohibited.
        </p>
    </div>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <mask id="eraser-mask">
                <rect width="100%" height="100%" fill="white" />
                <g id="cleared-regions"></g>
            </mask>
        </defs>
    </svg>

    <div id="noise-layer"></div>

    <div id="selection-box"></div>

    <div class="absolute top-12 left-12 text-gray-400 font-mono text-xs tracking-widest z-40 pointer-events-none">
        [ 056 : NOISE_ERASER ]<br>
        DATA_CORRUPTION: HIGH<br>
        <span id="cleared-count" class="text-cyan-400">CLEARED_REGIONS: 0</span>
    </div>
    
    <div class="absolute bottom-12 left-12 text-gray-500 font-mono text-[10px] tracking-widest z-40 pointer-events-none uppercase">
        Click and drag to isolate and delete noise interference.
    </div>

    <script>
        const selectionBox = document.getElementById('selection-box');
        const clearedRegions = document.getElementById('cleared-regions');
        const clearedCountDisplay = document.getElementById('cleared-count');
        
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let clearCount = 0;

        // 1. 마우스 누름 (드래그 시작)
        document.addEventListener('mousedown', (e) => {
            // 좌클릭만 허용
            if (e.button !== 0) return;
            
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;

            // 선택 상자 위치 초기화 및 표시
            selectionBox.style.left = `${startX}px`;
            selectionBox.style.top = `${startY}px`;
            selectionBox.style.width = '0px';
            selectionBox.style.height = '0px';
            selectionBox.style.display = 'block';
        });

        // 2. 마우스 이동 (선택 영역 그리기)
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const currentX = e.clientX;
            const currentY = e.clientY;

            // 마우스를 시작점보다 왼쪽/위로 드래그할 때를 대비한 계산 (Math.min, Math.max 사용)
            const left = Math.min(startX, currentX);
            const top = Math.min(startY, currentY);
            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);

            // 선택 상자 CSS 업데이트
            selectionBox.style.left = `${left}px`;
            selectionBox.style.top = `${top}px`;
            selectionBox.style.width = `${width}px`;
            selectionBox.style.height = `${height}px`;
        });

        // 3. 마우스 뗌 (노이즈 삭제 실행)
        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            // 선택 상자 숨기기
            selectionBox.style.display = 'none';

            // 최종 영역 계산
            const endX = e.clientX;
            const endY = e.clientY;
            
            const left = Math.min(startX, endX);
            const top = Math.min(startY, endY);
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);

            // 🎯 [핵심] 드래그한 영역이 너무 작으면(클릭 수준이면) 무시
            if (width > 10 && height > 10) {
                // SVG 마스크에 검은색 사각형(rect) 추가 -> 노이즈 레이어에 구멍이 뚫림!
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", left);
                rect.setAttribute("y", top);
                rect.setAttribute("width", width);
                rect.setAttribute("height", height);
                rect.setAttribute("fill", "black"); // 검은색 = 투명화
                
                clearedRegions.appendChild(rect);

                // 상태 업데이트
                clearCount++;
                clearedCountDisplay.innerText = `CLEARED_REGIONS: ${clearCount}`;
            }
        });
    </script>
</body>
</html>
