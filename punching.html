<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Punching Lab | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 1. 배경 레이어 (윈도우 기본 배경 이미지) */
        #windows-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; h-full;
            background-image: url('https://upload.wikimedia.org/wikipedia/en/thumb/5/5f/Windows_10_Default_Wallpaper.png/1200px-Windows_10_Default_Wallpaper.png');
            background-size: cover;
            background-position: center;
            z-index: -2; /* 가장 아래에 위치 */
        }

        /* 2. 전경 레이어 (우리가 뚫을 '스크린') */
        #foreground-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; h-full;
            background-color: #f3f4f6; /* 회색 스크린 */
            z-index: -1; /* 배경 위에 위치 */
            
            /* 핵심: 마스크 적용 (나중에 자바스크립트로 구멍을 추가할 거야) */
            -webkit-mask-image: url(#punch-mask);
            mask-image: url(#punch-mask);
        }

        /* 3. SVG 마스크 오버레이 (실제로 뚫릴 구멍들의 형상을 관리) */
        #mask-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; h-full;
            pointer-events: auto; /* 마스크 위에서 클릭을 감지해야 함 */
            z-index: 10; /* 가장 위에 위치 */
        }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden text-gray-900">

    <div id="windows-background"></div>

    <div id="foreground-screen" class="flex flex-col items-center justify-center">
        <h2 class="text-3xl font-black tracking-tighter mb-4 text-center">[ 033 : PUNCHING_LAB ]</h2>
        <p class="text-gray-400 tracking-widest text-sm uppercase text-center max-w-lg">
            Click anywhere to punch heart-shaped holes and reveal the hidden system. 
            All actions are archived on the substrate.
        </p>
    </div>

    <svg id="mask-overlay" width="100%" height="100%">
        <defs>
            <mask id="punch-mask">
                <rect width="100%" height="100%" fill="white" />
                <g id="punch-holes"></g>
            </mask>
        </defs>
    </svg>

    <div class="fixed bottom-8 left-8 p-4 bg-white/60 backdrop-blur-sm border border-gray-100 flex justify-between items-center z-50 rounded-sm">
        <span id="punch-count" class="text-xs font-mono text-gray-500 uppercase tracking-widest mr-6">PUNCHED: 0 / 64</span>
        <button onclick="resetPunching()" class="text-[10px] font-bold border border-black px-3 py-1 hover:bg-black hover:text-white transition-colors">RESET SYSTEM</button>
    </div>

    <script>
        const maskOverlay = document.getElementById('mask-overlay');
        const punchHoles = document.getElementById('punch-holes');
        const punchCount = document.getElementById('punch-count');
        let currentPunches = 0;
        const maxPunches = 64; // 최대 64개 펀칭

        // 하트 모양 SVG path 데이터 (상대적 크기)
        const heartPathData = "M 10 30 A 20 20 0 0 1 50 30 A 20 20 0 0 1 90 30 Q 90 60 50 90 Q 10 60 10 30 z";

        // 클릭 이벤트 리스너 (마스크 오버레이 위에서 클릭)
        maskOverlay.addEventListener('click', function(event) {
            if (currentPunches >= maxPunches) {
                alert('ARCHIVE IS FULL. RESET SYSTEM TO CONTINUE.');
                return;
            }

            // 클릭한 좌표 얻기
            const x = event.clientX;
            const y = event.clientY;

            // 새로운 SVG path element 생성 (검은색 하트)
            const newHole = document.createElementNS("http://www.w3.org/2000/svg", "path");
            newHole.setAttribute("d", heartPathData);
            newHole.setAttribute("fill", "black"); // 검은색으로 칠하면 마스크가 구멍으로 인식함

            // 하트 도형의 중심이 클릭 지점에 오도록 이동 및 살짝 크기 키움
            // (하트 이미지의 중심 좌표가 대략 50, 60이라서 보정)
            newHole.setAttribute("transform", `translate(${x - 50 * 1.5}, ${y - 60 * 1.5}) scale(1.5)`);

            // 마스크의 'punch-holes' 그룹에 추가
            punchHoles.appendChild(newHole);

            // 상태 업데이트
            currentPunches++;
            punchCount.innerText = `PUNCHED: ${currentPunches} / 64`;
        });

        // 리셋 함수
        function resetPunching() {
            // 마스크에 추가된 모든 구멍 제거
            punchHoles.innerHTML = '';
            currentPunches = 0;
            punchCount.innerText = `PUNCHED: ${currentPunches} / 64`;
        }
    </script>
</body>
</html>
