<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Punching Lab | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        /* 1. 가장 밑에 깔리는 윈도우 배경 */
        #windows-background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; /* h-full 오류 수정 */
            background-image: url('https://upload.wikimedia.org/wikipedia/en/thumb/5/5f/Windows_10_Default_Wallpaper.png/1200px-Windows_10_Default_Wallpaper.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        /* 2. 전경 스크린과 구멍을 담당할 전체 화면 SVG */
        #svg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            cursor: crosshair; /* 조준점 커서로 타격감 상승 */
        }

        /* 3. 텍스트와 UI가 올라갈 레이어 (클릭 방해 안 하게 pointer-events: none) */
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #111827;
        }
        
        /* 버튼만 클릭 가능하게 예외 처리 */
        .clickable { pointer-events: auto; }

        /* 🔥 [추가] 펀칭 애니메이션 (구멍이 뻥! 뚫리는 느낌) */
        @keyframes punchPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); }
        }
        .punch-anim {
            animation: punchPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 🔥 [추가] 화면 전체 흔들림 (타격감 극대화) */
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 5px) rotate(-1deg); }
            40% { transform: translate(5px, -4px) rotate(1deg); }
            60% { transform: translate(-3px, 2px) rotate(0deg); }
            80% { transform: translate(2px, -1px); }
            100% { transform: translate(0, 0); }
        }
        .shake-screen {
            animation: shake 0.2s ease-out;
        }
    </style>
</head>
<body class="select-none">

    <div id="windows-background"></div>

    <svg id="svg-layer" width="100%" height="100%">
        <defs>
            <mask id="punch-mask">
                <rect width="100%" height="100%" fill="white" />
                <g id="punch-holes"></g>
            </mask>
        </defs>

        <rect width="100%" height="100%" fill="#f3f4f6" mask="url(#punch-mask)" />
    </svg>

    <div id="ui-layer">
        <h2 class="text-3xl font-black tracking-tighter mb-4 text-center">[ 033 : PUNCHING_LAB ]</h2>
        <p class="text-gray-400 tracking-widest text-sm uppercase text-center max-w-lg">
            Click anywhere to punch heart-shaped holes and reveal the hidden system. 
        </p>

        <div class="absolute bottom-8 left-8 p-4 bg-white/60 backdrop-blur-sm border border-gray-200 flex justify-between items-center rounded-sm clickable">
            <span id="punch-count" class="text-xs font-mono text-gray-500 uppercase tracking-widest mr-6">PUNCHED: 0 / 64</span>
            <button onclick="resetPunching()" class="text-[10px] font-bold border border-black px-3 py-1 hover:bg-black hover:text-white transition-colors">RESET SYSTEM</button>
        </div>
    </div>

    <script>
        const svgLayer = document.getElementById('svg-layer');
        const punchHoles = document.getElementById('punch-holes');
        const punchCount = document.getElementById('punch-count');
        let currentPunches = 0;
        const maxPunches = 64;

        // 클릭 이벤트 (SVG 위에서 작동)
        svgLayer.addEventListener('click', function(event) {
            if (currentPunches >= maxPunches) {
                alert('ARCHIVE IS FULL. RESET SYSTEM TO CONTINUE.');
                return;
            }

            // 1. 그룹(<g>) 생성 및 마우스 위치로 이동
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("transform", `translate(${event.clientX}, ${event.clientY})`);

            // 2. 완벽한 비율의 하트 패스 생성 (중심점이 0,0이 되도록 좌표 재조정)
            const newHole = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // 크기와 형태가 최적화된 하트 벡터 데이터
            newHole.setAttribute("d", "M 0 -15 C -30 -45, -60 5, 0 40 C 60 5, 30 -45, 0 -15 Z");
            newHole.setAttribute("fill", "black"); 
            
            // 3. 팝업 애니메이션 클래스 추가
            newHole.setAttribute("class", "punch-anim");

            // 마스크에 추가
            g.appendChild(newHole);
            punchHoles.appendChild(g);

            // 4. 🔥 타격감: 화면 전체 흔들기 (Screen Shake)
            // 클래스를 뺐다가 다시 넣어서 애니메이션을 재시작함
            document.body.classList.remove('shake-screen');
            void document.body.offsetWidth; // 브라우저 리플로우 강제 유발 (애니메이션 리셋 꼼수)
            document.body.classList.add('shake-screen');

            // 상태 업데이트
            currentPunches++;
            punchCount.innerText = `PUNCHED: ${currentPunches} / 64`;
        });

        // 리셋 함수
        function resetPunching() {
            punchHoles.innerHTML = '';
            currentPunches = 0;
            punchCount.innerText = `PUNCHED: ${currentPunches} / 64`;
            document.body.classList.remove('shake-screen');
        }
    </script>
</body>
</html>
