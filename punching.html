<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Punching Lab | DFA Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        /* 1. [가장 아래] 윈도우 배경 (약간 어둡게 처리하여 대비 상승) */
        #windows-background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: url('https://upload.wikimedia.org/wikipedia/en/thumb/5/5f/Windows_10_Default_Wallpaper.png/1200px-Windows_10_Default_Wallpaper.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
            /* 🔥 [수정] 배경을 30% 어둡게 하여 구멍과 대비시킴 */
            filter: brightness(0.7); 
        }

        /* 2. 전경 스크린과 구멍을 담당할 SVG */
        #svg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            cursor: cell; /* 정밀한 타격감을 위한 십자선 커서 */
        }

        /* 3. UI 레이어 */
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }
        
        .clickable { pointer-events: auto; }

        /* 🔥 [수정] 흔들림 애니메이션 삭제됨 */

        /* 펀칭 애니메이션 (구멍이 생성되는 미세한 효과) */
        @keyframes punchPop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .punch-anim {
            animation: punchPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

    </style>
</head>
<body class="select-none h-screen w-screen">

    <div id="windows-background"></div>

    <svg id="svg-layer" width="100%" height="100%">
        <defs>
            <mask id="punch-mask">
                <rect width="100%" height="100%" fill="white" />
                <g id="punch-holes"></g>
            </mask>
        </defs>

        <rect width="100%" height="100%" fill="#fef3c7" mask="url(#punch-mask)" />
    </svg>

    <div id="ui-layer">
        <h2 class="text-3xl font-black tracking-tighter mb-4 text-center">[ 033 : PUNCHING_LAB ]</h2>
        <p class="text-gray-600 tracking-widest text-sm uppercase text-center max-w-lg leading-relaxed">
            Click anywhere to punch heart-shaped holes and reveal the hidden system substrate.
        </p>

        <div class="absolute bottom-12 left-12 p-5 bg-white/70 backdrop-blur-md border border-gray-200 flex justify-between items-center rounded-sm clickable shadow-xl">
            <span id="punch-count" class="text-xs font-mono text-gray-700 uppercase tracking-widest mr-8">PUNCHED: 0 / 64</span>
            <button onclick="resetPunching()" class="text-[10px] font-bold border border-gray-900 px-4 py-1.5 hover:bg-gray-900 hover:text-white transition-all uppercase tracking-wider">RESET SYSTEM</button>
        </div>
    </div>

    <script>
        const svgLayer = document.getElementById('svg-layer');
        const punchHoles = document.getElementById('punch-holes');
        const punchCount = document.getElementById('punch-count');
        let currentPunches = 0;
        const maxPunches = 64;

        // 클릭 이벤트
        svgLayer.addEventListener('click', function(event) {
            if (currentPunches >= maxPunches) {
                alert('ARCHIVE IS FULL. RESET SYSTEM TO CONTINUE.');
                return;
            }

            const x = event.clientX;
            const y = event.clientY;

            // 1. 그룹(<g>) 생성 및 마우스 위치로 이동
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("transform", `translate(${x}, ${y})`);
            g.setAttribute("class", "punch-anim"); // 팝업 애니메이션 적용

            // 2. 완벽한 비율의 하트 패스 (가장자리 디테일을 위해 <path> 사용)
            const heartHole = document.createElementNS("http://www.w3.org/2000/svg", "path");
            heartHole.setAttribute("d", "M 0 -15 C -30 -45, -60 5, 0 40 C 60 5, 30 -45, 0 -15 Z");
            heartHole.setAttribute("fill", "black"); // 검은색으로 뚫음

            // 🔥 [추가] 종이가 찢어진 듯한 거친 질감 (Roughen Effect)
            // 하트 가장자리에 미세하고 랜덤한 찢어짐 효과를 주기 위해 스위글(Swiggle) 라인을 덧댐
            const roughenHole = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // 기존 하트 데이터에 미세한 불규칙성을 더한 패스
            roughenHole.setAttribute("d", "M 2 -16 C -28 -48, -63 8, 3 38 C 58 3, 33 -47, 2 -16 Z M -3 -14 C -33 -44, -58 2, -3 43 C 63 8, 27 -42, -3 -14 Z");
            roughenHole.setAttribute("fill", "black");
            roughenHole.setAttribute("fill-opacity", "0.6"); // 찢어진 부분의 불규칙한 투명도

            // 마스크 그룹에 추가
            g.appendChild(heartHole);
            g.appendChild(roughenHole); // 거친 가장자리 레이어 추가
            punchHoles.appendChild(g);

            // 🔥 [수정] 흔들림 애니메이션 삭제됨

            // 상태 업데이트
            currentPunches++;
            punchCount.innerText = `PUNCHED: ${currentPunches} / 64`;
        });

        // 리셋 함수
        function resetPunching() {
            punchHoles.innerHTML = '';
            currentPunches = 0;
            punchCount.innerText = `PUNCHED: ${currentPunches} / 64`;
        }
    </script>
</body>
</html>
